<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Paint PWA</title>
    
    <!-- Configurações do PWA (Manifest Inline) -->
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Mini%20Paint%20PWA%22,%22short_name%22:%22Paint%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f0f0f0%22,%22theme_color%22:%22%23333333%22}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* Barra de Ferramentas Superior */
        #toolbar {
            background-color: #333;
            color: #fff;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Menu Arquivo Dropdown */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #444;
            min-width: 140px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            z-index: 20;
            border-radius: 4px;
            margin-top: 2px;
        }

        .dropdown-content button {
            color: white;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            border: none;
            background: transparent;
            border-radius: 0;
        }

        .dropdown-content button:hover {
            background-color: #007bff;
        }

        .dropdown-content button:first-child { border-top-left-radius: 4px; border-top-right-radius: 4px; }
        .dropdown-content button:last-child { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }

        .show { display: block; }

        label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ccc;
        }

        input[type="color"] {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        input[type="range"] {
            width: 80px;
            accent-color: #007bff;
        }

        button {
            background-color: #444;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:active, button.active {
            background-color: #007bff;
            border-color: #0056b3;
        }

        button#clear {
            background-color: #d9534f;
            border-color: #d43f3a;
            margin-left: auto;
        }
        
        button#clear:active {
            background-color: #c9302c;
        }

        /* Área do Canvas */
        #canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: crosshair;
            touch-action: none;
        }

        /* Input de arquivo invisível */
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <!-- Menu Arquivo -->
        <div class="dropdown">
            <button id="menuBtn">Arquivo ▾</button>
            <div id="menuDropdown" class="dropdown-content">
                <button id="btnOpen">Abrir...</button>
                <button id="btnSave">Salvar Imagem</button>
            </div>
        </div>

        <input type="file" id="fileInput" accept="image/*">

        <div class="tool-group">
            <label for="colorPicker">Cor:</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="tool-group">
            <button id="toolBrush" class="active">Pincel</button>
            <button id="toolEraser">Borracha</button>
        </div>

        <div class="tool-group">
            <label id="sizeLabel" for="sizeSlider">Tam: 5px</label>
            <input type="range" id="sizeSlider" min="1" max="50" value="5">
        </div>

        <button id="clear">Limpar</button>
    </div>

    <div id="canvas-container">
        <canvas id="paintCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        // Controles da Interface
        const colorPicker = document.getElementById('colorPicker');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeLabel = document.getElementById('sizeLabel');
        const toolBrush = document.getElementById('toolBrush');
        const toolEraser = document.getElementById('toolEraser');
        const clearBtn = document.getElementById('clear');
        
        // Menu e Arquivo
        const menuBtn = document.getElementById('menuBtn');
        const menuDropdown = document.getElementById('menuDropdown');
        const btnOpen = document.getElementById('btnOpen');
        const btnSave = document.getElementById('btnSave');
        const fileInput = document.getElementById('fileInput');

        // Estado do App
        let isDrawing = false;
        let currentTool = 'brush'; 
        let lastX = 0;
        let lastY = 0;

        // Ajusta o tamanho do canvas mantendo a proporção
        function resizeCanvas() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCtx.drawImage(canvas, 0, 0);

            const margin = 20;
            canvas.width = container.clientWidth - margin;
            canvas.height = container.clientHeight - margin;

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(tempCanvas, 0, 0);
            
            setupCanvasContext();
        }

        function setupCanvasContext() {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        // Coordenadas Touch / Mouse
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrawing(e) {
            isDrawing = true;
            const coords = getCoordinates(e);
            lastX = coords.x;
            lastY = coords.y;
            draw(e);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const coords = getCoordinates(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);

            if (currentTool === 'eraser') {
                ctx.strokeStyle = '#ffffff';
            } else {
                ctx.strokeStyle = colorPicker.value;
            }
            
            ctx.lineWidth = sizeSlider.value;
            ctx.stroke();

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath();
        }

        // Listeners de Desenho
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        // Controladores das Ferramentas
        toolBrush.addEventListener('click', () => {
            currentTool = 'brush';
            toolBrush.classList.add('active');
            toolEraser.classList.remove('active');
        });

        toolEraser.addEventListener('click', () => {
            currentTool = 'eraser';
            toolEraser.classList.add('active');
            toolBrush.classList.remove('active');
        });

        sizeSlider.addEventListener('input', (e) => {
            sizeLabel.textContent = `Tam: ${e.target.value}px`;
        });

        clearBtn.addEventListener('click', () => {
            if (confirm('Tem certeza de que deseja limpar a tela?')) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        /* --- Lógica do Menu Arquivo --- */
        
        // Alternar visualização do Dropdown
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuDropdown.classList.toggle('show');
        });

        // Fechar o menu se o usuário clicar fora dele
        window.addEventListener('click', () => {
            if (menuDropdown.classList.contains('show')) {
                menuDropdown.classList.remove('show');
            }
        });

        // Evento do botão Abrir
        btnOpen.addEventListener('click', () => {
            fileInput.click();
        });

        // Carregar a imagem no Canvas
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    // Limpa a tela com fundo branco antes de desenhar a imagem
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Redimensiona proporcionalmente para caber no canvas atual se for muito grande
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
                    const newWidth = img.width * ratio;
                    const newHeight = img.height * ratio;
                    const x = (canvas.width - newWidth) / 2;
                    const y = (canvas.height - newHeight) / 2;

                    ctx.drawImage(img, x, y, newWidth, newHeight);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            fileInput.value = ''; // Reseta o input para permitir carregar a mesma imagem de novo se quiser
        });

        // Evento do botão Salvar
        btnSave.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'meu-desenho.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Inicialização e SW Offline
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            
            if ('serviceWorker' in navigator) {
                const swCode = `
                    self.addEventListener('fetch', function(event) {
                        event.respondWith(fetch(event.request).catch(() => new Response("Offline")));
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(err => console.log("SW pronto."));
            }
        });
    </script>
</body>
</html>
