    /* botões metálicos / skeuomórficos
================================================== */
.custom-btn {
  width: 190px;
  height: 40px;
  color: #4c4c4c;
  border-radius: 5px;
  padding: 10px 25px;
  font-family: 'Lato', sans-serif;
  font-size: 22px;
  font-weight: 599;
  font-style: normal;
  text-shadow: 0px 1px 0px #fff;
  text-decoration: none;
  background: transparent;
  cursor: pointer;
  position: relative;
  display: inline-block;
  box-shadow: inset 0px 1px 0px rgba(255,255,255,1),0px 1px 3px rgba(0,0,0,0.3);
  outline: none;
  border: 1px solid #ba6;
}
.custom-btn:active {
  -webkit-transform: translateY(2px);
  transform: translateY(2px);
}

    
    .button {
      margin: 0.5rem 0.25rem;
      padding: 10px 20px;
      font-size: 16px;
      backface-visibility: hidden;
  position: relative;
  cursor: pointer;
  display: inline-block;
  white-space: nowrap;
  border-color: #7c7c7c;
  background: linear-gradient(180deg,#e6e6e6 0%,rgba(0, 0, 0, 0.25) 49%, rgba(38, 38, 38, 0.6) 51%,rgba(0, 0, 0, 0.25) 100%);
  border-radius: 5px;
  margin-bottom: 25px;
      user-select: none;
    }
    
    /* divisores em relevo
================================================== */
.bottom-gradient {
  position: relative;
  height: 0;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #fff;
  z-index: -99;
  clear: both;
  margin: 15px 0;
}
.bottom-gradient span {
  border: medium none;
  display: block;
  height: 80px;
  margin: 0;
  padding: 0;
  position: absolute;
  top: -80px;
  z-index: -100;
}
.bottom-gradient .left {
  background: -webkit-radial-gradient(bottom right, circle, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  background: -moz-radial-gradient(bottom right, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  width: 80px;
  left: 0;
}
.bottom-gradient .center {
  background: -webkit-radial-gradient(bottom left, circle, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  background: -moz-radial-gradient(bottom left, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  width: 80px;
  right: 0;
}
.bottom-gradient .right {
  position: relative;
  margin-left: 80px;
  margin-right: 80px;
  top: -80px;
  background: -webkit-linear-gradient(bottom, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  background: -moz-linear-gradient(bottom, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
}

.tab-btn {
  width: auto;
  height: auto;
  padding: 8px 20px;
  font-size: 18px;
  opacity: 0.6;
}
.tab-btn.active {
  opacity: 1;
  box-shadow: inset 0px 1px 4px rgba(0,0,0,0.35), 0px 1px 0px rgba(255,255,255,0.6);
}

<body>
  <h1>Câmera</h1>
  <video id="cameraStream" autoplay playsinline muted></video>
  <div class="bottom-gradient">
  <span class="left"></span>
  <span class="center"></span>
  <span class="right"></span>
</div>
  <div>
    <button class="custom-btn button" id="toggleCameraBtn">Alternar Câmera</button>
    <button class="custom-btn button" id="takePhotoBtn">📷 Tirar Foto</button>
  </div>
  <script>
    const videoElement = document.getElementById("cameraStream");
    const toggleBtn = document.getElementById("toggleCameraBtn");
    const takePhotoBtn = document.getElementById("takePhotoBtn");

    let currentFacingMode = "environment";
    let currentStream = null;

    async function setupCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach((track) => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode },
          audio: false,
        });
        videoElement.srcObject = currentStream;
      } catch (err) {
        alert("Erro ao acessar câmera: " + err.message);
      }
    }

    toggleBtn.onclick = () => {
      currentFacingMode =
        currentFacingMode === "environment" ? "user" : "environment";
      setupCamera();
    };

    takePhotoBtn.onclick = () => {
      if (!videoElement.videoWidth || !videoElement.videoHeight) {
        alert("Vídeo não está pronto para captura.");
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      // Gerar base64 da imagem
      const dataUrl = canvas.toDataURL("image/jpeg", 0.9);

      // Pegar array atual no localStorage ou criar vazio
      let fotos = JSON.parse(localStorage.getItem("cameraPhotos") || "[]");

      // Adicionar nova foto com timestamp para nome
      fotos.push({
        name: `foto_${new Date().toISOString().replace(/[:.]/g, "-")}.jpeg`,
        dataUrl,
      });

      // Salvar de volta no localStorage
      localStorage.setItem("cameraPhotos", JSON.stringify(fotos));

      alert("Foto salva no armazenamento local! Vá ao gerenciador para importar.");
    };

    window.addEventListener("DOMContentLoaded", setupCamera);
  </script>
</body>
