<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calibrador de Touch</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: rgba(255,255,255,0.06);
    --panel-border: rgba(255,255,255,0.12);
    --accent: #5ec9c2;
    --accent-off: #ff6b6b;
    --text: #e6edf3;
    --text-dim: #8b96a3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    padding: 10px 14px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header h1 span { color: var(--text-dim); font-weight: 400; font-size: 12px; display:block; margin-top:2px;}

  #controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggle {
    padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; line-height:1.3;
  }
  .toggle.on {
    background: rgba(94,201,194,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .toggle small { display:block; font-weight:400; font-size:10px; opacity:0.8; }

  #stage {
    position: relative; flex: 1; overflow: hidden;
    background:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  #readout {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 8px 12px; font-size: 11px;
    color: var(--text-dim); pointer-events: none; z-index: 20;
    font-variant-numeric: tabular-nums;
  }
  #readout b { color: var(--text); }
  #readout .raw { color: var(--accent-off); }
  #readout .fix { color: var(--accent); }

  .target {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid var(--panel-border); background: rgba(255,255,255,0.03);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--text-dim);
    transform: translate(-50%, -50%); transition: all .15s ease;
    pointer-events: none; z-index: 5;
  }
  .target.hit {
    border-color: var(--accent); color: var(--accent);
    background: rgba(94,201,194,0.15); transform: translate(-50%,-50%) scale(1.15);
  }

  .marker {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; pointer-events: none; z-index: 10;
    border: 2px solid var(--accent); box-shadow: 0 0 14px rgba(94,201,194,0.6);
  }
  .marker::before, .marker::after {
    content: ""; position: absolute; background: var(--accent);
  }
  .marker::before { left: 50%; top: -8px; width: 1px; height: 8px; }
  .marker::after { top: 50%; left: -8px; height: 1px; width: 8px; }

  .raw-marker {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px;
    border-radius: 50%; pointer-events: none; z-index: 9;
    background: var(--accent-off); opacity: 0.5;
  }

  footer {
    padding: 8px 14px; background: var(--panel);
    border-top: 1px solid var(--panel-border);
    font-size: 11px; color: var(--text-dim);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  #config-str { color: var(--accent); font-family: monospace; }
  #reset-btn {
    background: none; border: 1px solid var(--panel-border); color: var(--text-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 11px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Calibrador de Touch<span>Toque na área abaixo para testar a correção</span></h1>
    <div id="controls">
      <button class="toggle" id="btnSwap">Trocar X ↔ Y<small>desativado</small></button>
      <button class="toggle" id="btnInvX">Inverter X<small>desativado</small></button>
      <button class="toggle" id="btnInvY">Inverter Y<small>desativado</small></button>
    </div>
  </header>

  <div id="stage">
    <div id="readout">
      Bruto: <b class="raw" id="rawXY">-, -</b><br>
      Corrigido: <b class="fix" id="fixXY">-, -</b>
    </div>
  </div>

  <footer>
    <span>Config atual: <span id="config-str">swap=0 invX=0 invY=0</span></span>
    <button id="reset-btn">Limpar alvos</button>
  </footer>
</div>

<script>
const stage = document.getElementById('stage');
const rawXY = document.getElementById('rawXY');
const fixXY = document.getElementById('fixXY');
const configStr = document.getElementById('config-str');

let swapXY = false, invertX = false, invertY = false;

const btnSwap = document.getElementById('btnSwap');
const btnInvX = document.getElementById('btnInvX');
const btnInvY = document.getElementById('btnInvY');

function refreshButtons(){
  btnSwap.classList.toggle('on', swapXY);
  btnSwap.querySelector('small').textContent = swapXY ? 'ativado' : 'desativado';
  btnInvX.classList.toggle('on', invertX);
  btnInvX.querySelector('small').textContent = invertX ? 'ativado' : 'desativado';
  btnInvY.classList.toggle('on', invertY);
  btnInvY.querySelector('small').textContent = invertY ? 'ativado' : 'desativado';
  configStr.textContent = `swap=${swapXY?1:0} invX=${invertX?1:0} invY=${invertY?1:0}`;
}
btnSwap.onclick = () => { swapXY = !swapXY; refreshButtons(); };
btnInvX.onclick = () => { invertX = !invertX; refreshButtons(); };
btnInvY.onclick = () => { invertY = !invertY; refreshButtons(); };
refreshButtons();

// transforma coordenada bruta (relativa à tela) na coordenada corrigida
function correct(x, y, w, h){
  let nx = x / w, ny = y / h;
  if (swapXY) { const t = nx; nx = ny; ny = t; }
  if (invertX) nx = 1 - nx;
  if (invertY) ny = 1 - ny;
  return { x: nx * w, y: ny * h };
}

// alvos de teste 3x3
const targets = [];
function buildTargets(){
  targets.forEach(t => t.el.remove());
  targets.length = 0;
  const rect = stage.getBoundingClientRect();
  const cols = 3, rows = 3;
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const el = document.createElement('div');
      el.className = 'target';
      const px = (c + 0.5) / cols * rect.width;
      const py = (r + 0.5) / rows * rect.height;
      el.style.left = px + 'px';
      el.style.top = py + 'px';
      el.textContent = r * cols + c + 1;
      stage.appendChild(el);
      targets.push({ el, x: px, y: py });
    }
  }
}
buildTargets();
window.addEventListener('resize', buildTargets);

document.getElementById('reset-btn').onclick = () => {
  targets.forEach(t => t.el.classList.remove('hit'));
};

function nearestTarget(x, y){
  let best = null, bestDist = 48; // raio de tolerância em px
  targets.forEach(t => {
    const d = Math.hypot(t.x - x, t.y - y);
    if (d < bestDist) { bestDist = d; best = t; }
  });
  return best;
}

const activeMarkers = {};

function handleTouch(id, clientX, clientY){
  const rect = stage.getBoundingClientRect();
  const rx = clientX - rect.left;
  const ry = clientY - rect.top;
  const fixed = correct(rx, ry, rect.width, rect.height);

  rawXY.textContent = `${Math.round(rx)}, ${Math.round(ry)}`;
  fixXY.textContent = `${Math.round(fixed.x)}, ${Math.round(fixed.y)}`;

  let m = activeMarkers[id];
  if (!m){
    m = {
      raw: document.createElement('div'),
      fix: document.createElement('div')
    };
    m.raw.className = 'raw-marker';
    m.fix.className = 'marker';
    stage.appendChild(m.raw);
    stage.appendChild(m.fix);
    activeMarkers[id] = m;
  }
  m.raw.style.left = rx + 'px';
  m.raw.style.top = ry + 'px';
  m.fix.style.left = fixed.x + 'px';
  m.fix.style.top = fixed.y + 'px';

  const hit = nearestTarget(fixed.x, fixed.y);
  targets.forEach(t => t.el.classList.remove('hit'));
  if (hit) hit.el.classList.add('hit');
}

function clearTouch(id){
  const m = activeMarkers[id];
  if (m){
    m.raw.remove();
    m.fix.remove();
    delete activeMarkers[id];
  }
}

stage.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) handleTouch(t.identifier, t.clientX, t.clientY);
}, { passive:false });

stage.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) handleTouch(t.identifier, t.clientX, t.clientY);
}, { passive:false });

stage.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) clearTouch(t.identifier);
}, { passive:false });

stage.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) clearTouch(t.identifier);
});

// fallback mouse (útil se testar no PC)
stage.addEventListener('mousedown', e => handleTouch('mouse', e.clientX, e.clientY));
stage.addEventListener('mousemove', e => { if (e.buttons) handleTouch('mouse', e.clientX, e.clientY); });
stage.addEventListener('mouseup', () => clearTouch('mouse'));
</script>
</body>
</html>
