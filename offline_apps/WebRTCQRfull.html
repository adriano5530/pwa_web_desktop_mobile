<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teclado Remoto WebRTC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 12px; }
        textarea, input[type="text"] { width: 100%; box-sizing: border-box; margin: 6px 0; font-family: monospace; font-size: 0.8em; }
        button { margin: 4px 4px 4px 0; padding: 8px 12px; }
        .qrbox { margin: 10px 0; display: flex; justify-content: center; }
        #status { font-weight: bold; min-height: 1.4em; }
        .step { display: none; border-top: 1px solid #ccc; padding-top: 10px; margin-top: 10px; }
        .step.visible { display: block; }
        label { display: block; font-size: 0.85em; color: #555; margin-top: 8px; }
        #scannerBox { display: none; margin: 10px 0; border: 1px solid #ccc; padding: 8px; }
        #scannerBox.visible { display: block; }
        #scannerRegion { width: 100%; max-width: 320px; }
        .row { display: flex; gap: 6px; align-items: center; }
        .row textarea { flex: 1; }
    </style>
</head>
<body>
    <h2>Teclado Remoto WebRTC</h2>

    <button onclick="startReceiver()">Iniciar como Receptor</button>
    <button onclick="startController()">Iniciar como Controlador</button>
    <button onclick="connectBluetooth()">Testar Bluetooth (só bateria, não é teclado)</button>
    <button onclick="location.reload()">Reiniciar</button>

    <p id="status">Status: Aguardando...</p>
    <p id="debugInfo" style="font-size:0.75em; color:#666;"></p>

    <!-- Receptor passo 1: mostra a oferta -->
    <div id="receiverStep1" class="step">
        <label>Sua OFERTA (mostre este QR ao Controlador, ou copie o texto):</label>
        <div class="qrbox" id="qrcodeOffer"></div>
        <div class="row">
            <textarea id="offerOutput" rows="3" readonly></textarea>
            <button onclick="copyField('offerOutput')">Copiar</button>
        </div>
    </div>

    <!-- Receptor passo 2: recebe a resposta -->
    <div id="receiverStep2" class="step">
        <label>Cole aqui a RESPOSTA gerada pelo Controlador (ou escaneie):</label>
        <textarea id="answerInput" rows="3"></textarea>
        <button onclick="openScanner('answerInput')">Escanear QR da resposta</button>
        <button onclick="applyAnswer()">Concluir conexão</button>
    </div>

    <!-- Controlador passo 1: cola a oferta -->
    <div id="controllerStep1" class="step">
        <label>Cole aqui a OFERTA do Receptor (ou escaneie o QR):</label>
        <textarea id="offerInput" rows="3"></textarea>
        <button onclick="openScanner('offerInput')">Escanear QR da oferta</button>
        <button onclick="acceptOffer()">Gerar resposta</button>
    </div>

    <!-- Controlador passo 2: mostra a resposta -->
    <div id="controllerStep2" class="step">
        <label>Sua RESPOSTA (mostre este QR ao Receptor, ou copie o texto):</label>
        <div class="qrbox" id="qrcodeAnswer"></div>
        <div class="row">
            <textarea id="answerOutput" rows="3" readonly></textarea>
            <button onclick="copyField('answerOutput')">Copiar</button>
        </div>
    </div>

    <div id="scannerBox">
        <div id="scannerRegion"></div>
        <button onclick="closeScanner()">Cancelar leitura</button>
    </div>

    <label>Texto recebido:</label>
    <textarea id="receiverArea" rows="5" placeholder="Texto recebido..." readonly></textarea>
    <input type="text" id="textInput" placeholder="Digite aqui..." style="display:none;">

    <script>
        let peerConnection;
        let dataChannel;
        let role = null; // 'receiver' | 'controller'

        // STUN ajuda a descobrir o endereço público; TURN retransmite o
        // tráfego quando a conexão direta P2P não é possível (NAT restritivo,
        // redes de operadora, etc). Sem TURN, algumas redes nunca conseguem
        // fechar a conexão mesmo com a sinalização correta.
        // Redes de operadora (dados móveis) costumam bloquear ou limitar UDP.
        // Sem uma variante TURN sobre TCP/TLS (porta 443), a conexão trava
        // silenciosamente em "checking" para sempre nesses casos. Por isso
        // incluímos turn:...443?transport=tcp e turns:...443?transport=tcp
        // além das variantes UDP originais.
        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                {
                    urls: "turn:openrelay.metered.ca:80",
                    username: "openrelayproject",
                    credential: "openrelayproject"
                },
                {
                    urls: "turn:openrelay.metered.ca:443",
                    username: "openrelayproject",
                    credential: "openrelayproject"
                },
                {
                    urls: "turn:openrelay.metered.ca:443?transport=tcp",
                    username: "openrelayproject",
                    credential: "openrelayproject"
                },
                {
                    urls: "turns:openrelay.metered.ca:443?transport=tcp",
                    username: "openrelayproject",
                    credential: "openrelayproject"
                }
            ]
        };

        function waitForIceGathering(pc, timeoutMs = 8000) {
            if (pc.iceGatheringState === "complete") return Promise.resolve();
            return new Promise((resolve) => {
                let done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    pc.removeEventListener("icegatheringstatechange", check);
                    resolve();
                }
                function check() {
                    if (pc.iceGatheringState === "complete") finish();
                }
                pc.addEventListener("icegatheringstatechange", check);
                setTimeout(finish, timeoutMs);
            });
        }

        function setStatus(msg) {
            document.getElementById("status").innerText = "Status: " + msg;
        }

        // Conta quantos candidatos de cada tipo (host = rede local, srflx =
        // via STUN, relay = via TURN) acabaram na SDP final. Se só houver
        // "host", os dois aparelhos precisam estar na mesma rede local pra
        // conectar. Se não houver nenhum "relay", o TURN não respondeu — a
        // rede provavelmente está bloqueando o tráfego até ele.
        function debugCandidates(sdp) {
            const host = (sdp.match(/ typ host/g) || []).length;
            const srflx = (sdp.match(/ typ srflx/g) || []).length;
            const relay = (sdp.match(/ typ relay/g) || []).length;
            const el = document.getElementById("debugInfo");
            el.innerText = `Candidatos coletados — host: ${host}, srflx (STUN): ${srflx}, relay (TURN): ${relay}`;
            if (relay === 0) {
                el.innerText += " ⚠️ Nenhum candidato TURN — se os aparelhos estiverem em redes diferentes, a conexão provavelmente vai falhar.";
            }
        }

        function showStep(id) {
            document.getElementById(id).classList.add("visible");
        }
        function hideStep(id) {
            document.getElementById(id).classList.remove("visible");
        }

        function copyField(id) {
            const el = document.getElementById(id);
            el.select();
            navigator.clipboard?.writeText(el.value).catch(() => document.execCommand("copy"));
        }

        // A SDP completa (com candidatos ICE de TURN incluídos) costuma passar
        // de 1-2KB em JSON puro, o que gera um QR denso demais para a câmera
        // ler com confiança. Comprimimos antes de gerar o QR; ao aplicar,
        // tentamos JSON.parse direto (texto colado sem compressão também
        // funciona) e só então tentamos descomprimir.
        function encodeSignal(obj) {
            return LZString.compressToEncodedURIComponent(JSON.stringify(obj));
        }
        function parseSignal(raw) {
            raw = raw.trim();
            try {
                return JSON.parse(raw);
            } catch (e) {
                const decompressed = LZString.decompressFromEncodedURIComponent(raw);
                if (!decompressed) throw new Error("dado inválido ou incompleto");
                return JSON.parse(decompressed);
            }
        }

        function renderQR(containerId, text) {
            const el = document.getElementById(containerId);
            el.innerHTML = "";
            new QRCode(el, {
                text: text,
                width: 260,
                height: 260,
                correctLevel: QRCode.CorrectLevel.L // menor redundância = mais capacidade de dados
            });
        }

        function setupDataChannelReceive(channel) {
            channel.onmessage = (e) => {
                const area = document.getElementById("receiverArea");
                if (e.data === "\b") {
                    area.value = area.value.slice(0, -1);
                } else {
                    area.value += e.data;
                }
            };
            channel.onopen = () => setStatus("Conectado! Recebendo dados.");
        }

        function attachIceLogging(pc, label) {
            pc.oniceconnectionstatechange = () => {
                console.log(label + " ICE state:", pc.iceConnectionState);
                if (pc.iceConnectionState === "failed" || pc.iceConnectionState === "disconnected") {
                    setStatus("Falha na conexão ICE (" + pc.iceConnectionState + "). Provavelmente precisa de um servidor TURN nessa rede.");
                } else if (pc.iceConnectionState === "checking") {
                    setStatus("Negociando rota de rede (ICE checking)...");
                } else if (pc.iceConnectionState === "connected") {
                    setStatus("ICE conectado! Aguardando canal de dados...");
                }
            };
            // Dispara quando um servidor STUN/TURN especifico falha em
            // responder — muito mais direto que ficar só olhando o estado
            // geral do ICE pra saber qual servidor está com problema.
            pc.onicecandidateerror = (e) => {
                console.warn(label + " candidato ICE com erro:", e.errorCode, e.errorText, e.url);
                const el = document.getElementById("debugInfo");
                el.innerText += ` | Erro em ${e.url}: ${e.errorCode} ${e.errorText || ""}`;
            };
            pc.onconnectionstatechange = () => {
                console.log(label + " connectionState:", pc.connectionState);
                if (pc.connectionState === "failed") {
                    setStatus("Conexão falhou (connectionState=failed). Tente novamente ou troque de rede (ex: Wi-Fi em vez de dados móveis).");
                }
            };
        }

        async function startReceiver() {
            role = "receiver";
            hideStep("controllerStep1");
            hideStep("controllerStep2");

            peerConnection = new RTCPeerConnection(rtcConfig);
            attachIceLogging(peerConnection, "Receptor");
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannelReceive(dataChannel);
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            setStatus("Gerando oferta (aguardando ICE)...");
            await waitForIceGathering(peerConnection);

            const offerStr = JSON.stringify(peerConnection.localDescription);
            document.getElementById("offerOutput").value = offerStr;
            renderQR("qrcodeOffer", encodeSignal(peerConnection.localDescription));
            debugCandidates(peerConnection.localDescription.sdp);

            showStep("receiverStep1");
            showStep("receiverStep2");
            setStatus("Oferta pronta! Mostre o QR ao Controlador, depois cole/escaneie a resposta dele abaixo.");
        }

        async function applyAnswer() {
            if (!peerConnection || role !== "receiver") {
                setStatus("Clique em 'Iniciar como Receptor' antes de colar/escanear a resposta.");
                return;
            }
            if (peerConnection.signalingState === "stable") {
                setStatus("Conexão já concluída anteriormente.");
                return;
            }
            try {
                const answer = parseSignal(document.getElementById("answerInput").value);
                await peerConnection.setRemoteDescription(answer);
                setStatus("Resposta aplicada. Conectando...");
            } catch (err) {
                setStatus("Erro ao aplicar resposta: " + err);
            }
        }

        async function startController() {
            role = "controller";
            hideStep("receiverStep1");
            hideStep("receiverStep2");

            peerConnection = new RTCPeerConnection(rtcConfig);
            attachIceLogging(peerConnection, "Controlador");
            dataChannel = peerConnection.createDataChannel("keyboard");
            dataChannel.onopen = () => setStatus("Conectado! Digite no campo abaixo.");

            const textInput = document.getElementById("textInput");
            textInput.style.display = "block";
            textInput.value = "";

            // Usamos inputType em vez de só pegar o último caractere: assim
            // backspace, enter e colar texto são detectados corretamente
            // mesmo em teclados virtuais Android, que nem sempre disparam
            // keydown de forma confiável.
            textInput.addEventListener("input", (e) => {
                if (!dataChannel || dataChannel.readyState !== "open") return;
                const it = e.inputType || "";
                if (it.startsWith("delete")) {
                    dataChannel.send("\b");
                } else if (it === "insertLineBreak") {
                    dataChannel.send("\n");
                } else if (e.data) {
                    dataChannel.send(e.data);
                } else if (it === "insertFromPaste") {
                    // fallback: alguns navegadores não preenchem e.data no paste
                    dataChannel.send(e.target.value.slice(-1));
                }
            });

            showStep("controllerStep1");
            setStatus("Cole ou escaneie a oferta do Receptor abaixo.");
        }

        async function acceptOffer() {
            if (!peerConnection || role !== "controller") {
                setStatus("Clique em 'Iniciar como Controlador' antes de colar/escanear a oferta.");
                return;
            }
            if (peerConnection.currentRemoteDescription) {
                setStatus("Oferta já processada anteriormente. Aguarde a conexão ou reinicie.");
                return;
            }
            try {
                const offer = parseSignal(document.getElementById("offerInput").value);
                await peerConnection.setRemoteDescription(offer);

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                setStatus("Gerando resposta (aguardando ICE)...");
                await waitForIceGathering(peerConnection);

                document.getElementById("answerOutput").value = JSON.stringify(peerConnection.localDescription);
                renderQR("qrcodeAnswer", encodeSignal(peerConnection.localDescription));
                debugCandidates(peerConnection.localDescription.sdp);
                showStep("controllerStep2");
                setStatus("Resposta pronta! Mostre este QR ao Receptor (ou envie o texto).");
            } catch (err) {
                setStatus("Erro ao processar oferta: " + err);
            }
        }

        let html5QrCode = null;
        let scanTargetId = null;

        async function openScanner(targetId) {
            scanTargetId = targetId;
            document.getElementById("scannerBox").classList.add("visible");

            html5QrCode = new Html5Qrcode("scannerRegion");
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    (decodedText) => {
                        document.getElementById(scanTargetId).value = decodedText;
                        closeScanner();
                    },
                    () => { /* frame sem QR legível, ignora */ }
                );
            } catch (err) {
                setStatus("Erro ao acessar câmera: " + err);
                closeScanner();
            }
        }

        async function closeScanner() {
            document.getElementById("scannerBox").classList.remove("visible");
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (e) { /* já parado */ }
                html5QrCode = null;
            }
        }

        async function connectBluetooth() {
            try {
                const bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service']
                });
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('battery_service');
                await service.getCharacteristic('battery_level');
                setStatus("Bluetooth conectado (apenas leitura de bateria, não é um teclado real).");
            } catch (error) {
                setStatus("Erro no Bluetooth: " + error);
            }
        }
    </script>
</body>
</html>
