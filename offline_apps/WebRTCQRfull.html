<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teclado Remoto WebRTC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 12px; }
        textarea, input[type="text"] { width: 100%; box-sizing: border-box; margin: 6px 0; }
        button { margin: 4px 4px 4px 0; padding: 8px 12px; }
        #qrcode { margin: 10px 0; }
        #status { font-weight: bold; }
        .step { display: none; border-top: 1px solid #ccc; padding-top: 10px; margin-top: 10px; }
        .step.visible { display: block; }
        label { display: block; font-size: 0.85em; color: #555; margin-top: 8px; }
        #scannerBox { display: none; margin: 10px 0; border: 1px solid #ccc; padding: 8px; }
        #scannerBox.visible { display: block; }
        #scannerRegion { width: 100%; max-width: 320px; }
    </style>
</head>
<body>
    <h2>Teclado Remoto WebRTC</h2>

    <button onclick="startReceiver()">Iniciar como Receptor</button>
    <button onclick="startController()">Iniciar como Controlador</button>
    <button onclick="connectBluetooth()">Testar Bluetooth (só bateria, não é teclado)</button>

    <p id="status">Status: Aguardando...</p>
    <div id="qrcode"></div>

    <!-- Receptor: mostra a oferta, depois recebe a resposta -->
    <div id="receiverStep2" class="step">
        <label>Cole aqui a RESPOSTA gerada pelo Controlador (ou escaneie):</label>
        <textarea id="answerInput" rows="4"></textarea>
        <button onclick="openScanner('answerInput')">Escanear QR da resposta</button>
        <button onclick="applyAnswer()">Concluir conexão</button>
    </div>

    <!-- Controlador: cola a oferta, gera a resposta -->
    <div id="controllerStep1" class="step">
        <label>Cole aqui a OFERTA do Receptor (ou escaneie o QR):</label>
        <textarea id="offerInput" rows="4"></textarea>
        <button onclick="openScanner('offerInput')">Escanear QR da oferta</button>
        <button onclick="acceptOffer()">Gerar resposta</button>
    </div>
    <div id="controllerStep2" class="step">
        <label>Envie esta RESPOSTA de volta ao Receptor:</label>
        <textarea id="answerOutput" rows="4" readonly></textarea>
    </div>

    <div id="scannerBox">
        <div id="scannerRegion"></div>
        <button onclick="closeScanner()">Cancelar leitura</button>
    </div>

    <textarea id="receiverArea" rows="5" placeholder="Texto recebido..." readonly></textarea>
    <input type="text" id="textInput" placeholder="Digite aqui..." style="display:none;">

    <script>
        let peerConnection;
        let dataChannel;
        let role = null; // 'receiver' | 'controller'

        // Servidor STUN público: ajuda o navegador a descobrir o endereço
        // público mais rápido. Sem isso, em algumas redes o ICE gathering
        // pode nunca chegar a "complete".
        const rtcConfig = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" }
            ]
        };

        // Espera o ICE gathering terminar (com timeout de segurança) para
        // garantir que a SDP embutida no QR/texto já contenha os candidates
        // disponíveis. Se não completar em tempo hábil, segue com o que tiver
        // (fallback), já que o STUN normalmente resolve o candidato principal rápido.
        function waitForIceGathering(pc, timeoutMs = 5000) {
            if (pc.iceGatheringState === "complete") return Promise.resolve();
            return new Promise((resolve) => {
                let done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    pc.removeEventListener("icegatheringstatechange", check);
                    resolve();
                }
                function check() {
                    if (pc.iceGatheringState === "complete") finish();
                }
                pc.addEventListener("icegatheringstatechange", check);
                setTimeout(finish, timeoutMs);
            });
        }

        function setStatus(msg) {
            document.getElementById("status").innerText = "Status: " + msg;
        }

        function showStep(id) {
            document.getElementById(id).classList.add("visible");
        }

        function setupDataChannelReceive(channel) {
            channel.onmessage = (e) => {
                document.getElementById("receiverArea").value += e.data;
            };
            channel.onopen = () => setStatus("Conectado! Recebendo dados.");
        }

        async function startReceiver() {
            role = "receiver";
            document.getElementById("controllerStep1").classList.remove("visible");
            document.getElementById("controllerStep2").classList.remove("visible");

            peerConnection = new RTCPeerConnection(rtcConfig);
            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannelReceive(dataChannel);
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            setStatus("Gerando oferta (aguardando ICE)...");
            await waitForIceGathering(peerConnection);

            const offerStr = JSON.stringify(peerConnection.localDescription);
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), offerStr);

            showStep("receiverStep2");
            setStatus("Oferta pronta! Escaneie o QR no Controlador, depois cole a resposta dele abaixo.");
        }

        async function applyAnswer() {
            if (!peerConnection || role !== "receiver") {
                setStatus("Clique em 'Iniciar como Receptor' antes de colar/escanear a resposta.");
                return;
            }
            if (peerConnection.signalingState === "stable") {
                setStatus("Conexão já concluída anteriormente.");
                return;
            }
            try {
                const answer = JSON.parse(document.getElementById("answerInput").value);
                await peerConnection.setRemoteDescription(answer);
                setStatus("Resposta aplicada. Conectando...");
            } catch (err) {
                setStatus("Erro ao aplicar resposta: " + err);
            }
        }

        async function startController() {
            role = "controller";
            document.getElementById("receiverStep2").classList.remove("visible");
            document.getElementById("qrcode").innerHTML = "";

            peerConnection = new RTCPeerConnection(rtcConfig);
            dataChannel = peerConnection.createDataChannel("keyboard");
            dataChannel.onopen = () => setStatus("Conectado! Digite no campo abaixo.");

            document.getElementById("textInput").style.display = "block";
            document.getElementById("textInput").addEventListener("input", (e) => {
                const char = e.target.value.slice(-1);
                if (dataChannel.readyState === "open") {
                    dataChannel.send(char);
                }
            });

            showStep("controllerStep1");
            setStatus("Cole a oferta do Receptor abaixo.");
        }

        async function acceptOffer() {
            if (!peerConnection || role !== "controller") {
                setStatus("Clique em 'Iniciar como Controlador' antes de colar/escanear a oferta.");
                return;
            }
            if (peerConnection.currentRemoteDescription) {
                setStatus("Oferta já processada anteriormente. Aguarde a conexão ou reinicie.");
                return;
            }
            try {
                const offer = JSON.parse(document.getElementById("offerInput").value);
                await peerConnection.setRemoteDescription(offer);

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                setStatus("Gerando resposta (aguardando ICE)...");
                await waitForIceGathering(peerConnection);

                document.getElementById("answerOutput").value = JSON.stringify(peerConnection.localDescription);
                showStep("controllerStep2");
                setStatus("Resposta pronta! Copie e envie de volta ao Receptor.");
            } catch (err) {
                setStatus("Erro ao processar oferta: " + err);
            }
        }

        let html5QrCode = null;
        let scanTargetId = null;

        async function openScanner(targetId) {
            scanTargetId = targetId;
            document.getElementById("scannerBox").classList.add("visible");

            html5QrCode = new Html5Qrcode("scannerRegion");
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    (decodedText) => {
                        document.getElementById(scanTargetId).value = decodedText;
                        closeScanner();
                    },
                    () => { /* frame sem QR legível, ignora */ }
                );
            } catch (err) {
                setStatus("Erro ao acessar câmera: " + err);
                closeScanner();
            }
        }

        async function closeScanner() {
            document.getElementById("scannerBox").classList.remove("visible");
            if (html5QrCode) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                } catch (e) { /* já parado */ }
                html5QrCode = null;
            }
        }

        async function connectBluetooth() {
            try {
                const bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service']
                });
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('battery_service');
                await service.getCharacteristic('battery_level');
                setStatus("Bluetooth conectado (apenas leitura de bateria, não é um teclado real).");
            } catch (error) {
                setStatus("Erro no Bluetooth: " + error);
            }
        }
    </script>
</body>
</html>
