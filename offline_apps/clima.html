<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clima</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: radial-gradient(
          circle at top left,
          rgba(255, 255, 255, 0.95) 0%,
          transparent 10%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(255, 255, 255, 0.75) 0%,
          transparent 30%
        );
      mask-image: linear-gradient(to bottom right, rgba(255,255,255,1.0), transparent);
      backdrop-filter: blur(15px) saturate(180%);
      -webkit-backdrop-filter: blur(15px) saturate(180%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #weather {
      background: rgba(5, 5, 5, 0.9);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      padding: 1rem 2rem;
      border-radius: 16px;
      text-align: center;
      text-shadow: 0px 1.3px 0px #333333;
      box-shadow: 0 0 10px #000;
    }

    #weather .icon {
      font-size: 56px;
      line-height: 1;
      display: block;
      margin: 8px 0;
    }

    .loading {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="weather" class="loading">
    <p>Obtendo localização...</p>
  </div>

  <script>
    // Mapeia os "weather codes" (WMO) do Open-Meteo para emoji + descrição em PT-BR
    const WEATHER_CODES = {
      0:  ["☀️", "Céu limpo"],
      1:  ["🌤️", "Poucas nuvens"],
      2:  ["⛅", "Parcialmente nublado"],
      3:  ["☁️", "Nublado"],
      45: ["🌫️", "Neblina"],
      48: ["🌫️", "Neblina com geada"],
      51: ["🌦️", "Garoa fraca"],
      53: ["🌦️", "Garoa moderada"],
      55: ["🌧️", "Garoa forte"],
      56: ["🌧️", "Garoa congelante fraca"],
      57: ["🌧️", "Garoa congelante forte"],
      61: ["🌧️", "Chuva fraca"],
      63: ["🌧️", "Chuva moderada"],
      65: ["🌧️", "Chuva forte"],
      66: ["🌧️", "Chuva congelante fraca"],
      67: ["🌧️", "Chuva congelante forte"],
      71: ["🌨️", "Neve fraca"],
      73: ["🌨️", "Neve moderada"],
      75: ["❄️", "Neve forte"],
      77: ["❄️", "Grãos de neve"],
      80: ["🌦️", "Pancadas de chuva fracas"],
      81: ["🌧️", "Pancadas de chuva moderadas"],
      82: ["⛈️", "Pancadas de chuva fortes"],
      85: ["🌨️", "Pancadas de neve fracas"],
      86: ["🌨️", "Pancadas de neve fortes"],
      95: ["⛈️", "Trovoada"],
      96: ["⛈️", "Trovoada com granizo fraco"],
      99: ["⛈️", "Trovoada com granizo forte"],
    };

    function descricaoClima(code) {
      return WEATHER_CODES[code] || ["🌡️", "Condição desconhecida"];
    }

    async function getWeatherData(lat, lon) {
      const el = document.getElementById("weather");
      try {
        // Clima atual - Open-Meteo (gratuito, sem chave, CORS liberado)
        const weatherRes = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code`
        );
        const weatherData = await weatherRes.json();

        const temp = Math.round(weatherData.current.temperature_2m);
        const code = weatherData.current.weather_code;
        const [icon, desc] = descricaoClima(code);

        // Nome da cidade - BigDataCloud (gratuito, sem chave, CORS liberado)
        let city = "";
        try {
          const geoRes = await fetch(
            `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=pt`
          );
          const geoData = await geoRes.json();
          city = geoData.city || geoData.locality || geoData.principalSubdivision || "";
        } catch (e) {
          // se a geocodificação falhar, seguimos sem o nome da cidade
        }

        el.innerHTML = `
          ${city ? `<h2>${city}</h2>` : ""}
          <span class="icon">${icon}</span>
          <p>${desc}</p>
          <h3>${temp}°C</h3>
        `;
        el.classList.remove("loading");
      } catch (err) {
        el.innerText = "Erro ao buscar clima.";
      }
    }

    function getLocationAndShowWeather() {
      if (!navigator.geolocation) {
        document.getElementById("weather").innerText = "Geolocalização não suportada.";
        return;
      }

      navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        getWeatherData(latitude, longitude);
      }, err => {
        document.getElementById("weather").innerText = "Permissão de localização negada.";
      });
    }

    getLocationAndShowWeather();
  </script>
</body>
</html>
