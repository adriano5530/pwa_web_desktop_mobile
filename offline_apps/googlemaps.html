<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google Maps</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* Abas */
    #tabs {
      display: flex;
      background: #f1f3f4;
      border-bottom: 1px solid #ddd;
    }
    .tab-btn {
      flex: 1;
      padding: 0.85rem 0.5rem;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 600;
      color: #5f6368;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tab-btn.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
      background: #fff;
    }
    .tab-btn:hover { background: #e8eaed; }

    /* Painéis de controle */
    .panel {
      display: none;
      padding: 0.75rem;
      gap: 0.5rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    .panel.active { display: flex; }

    .panel input[type="text"] {
      flex: 1;
      min-width: 140px;
      padding: 0.6rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .panel input[type="text"]:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .panel select {
      padding: 0.6rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.9rem;
      background: #fff;
    }

    .panel button {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: #1a73e8;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .panel button:hover { background: #1558b8; }
    .panel button:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }

    #status {
      font-size: 0.85rem;
      color: #5f6368;
      padding: 0 0.75rem 0.5rem;
      min-height: 1.2em;
    }
    #status.error { color: #d93025; }

    #map-wrapper {
      flex: 1;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #5f6368;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<div id="tabs">
  <button class="tab-btn active" data-tab="busca">🔍 Buscar local</button>
  <button class="tab-btn" data-tab="rota">🧭 Traçar rota</button>
</div>

<!-- Painel: Buscar local -->
<div class="panel active" id="panel-busca">
  <input type="text" id="input-busca" placeholder="Digite um local ou endereço..." />
  <button onclick="buscarLocal()">Buscar</button>
</div>

<!-- Painel: Traçar rota -->
<div class="panel" id="panel-rota">
  <input type="text" id="input-destino" placeholder="Destino..." />
  <select id="modo-transporte">
    <option value="d">🚗 Carro</option>
    <option value="w">🚶 A pé</option>
    <option value="b">🚲 Bicicleta</option>
    <option value="r">🚌 Transporte público</option>
  </select>
  <button onclick="tracarRota()">Traçar rota</button>
</div>

<div id="status"></div>

<div id="map-wrapper">
  <div id="map">
    <p>Obtendo localização...</p>
  </div>
</div>

<script>
  let minhaLat = null;
  let minhaLon = null;
  let ultimoLocalBuscado = "";

  // ---------- Utilitários ----------

  function setStatus(msg, isError = false) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = isError ? "error" : "";
  }

  function exibirIframe(url) {
    const iframe = document.createElement("iframe");
    iframe.src = url;
    const mapDiv = document.getElementById("map");
    mapDiv.innerHTML = "";
    mapDiv.appendChild(iframe);
  }

  function geocodificar(local) {
    return fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(local)}`)
      .then(res => res.json())
      .then(data => {
        if (data.length === 0) return null;
        return { lat: data[0].lat, lon: data[0].lon, nome: data[0].display_name };
      });
  }

  // ---------- Abas ----------

  function trocarAba(tab) {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === `panel-${tab}`));
    setStatus("");

    if (tab === "rota") {
      const inputDestino = document.getElementById("input-destino");
      if (!inputDestino.value.trim() && ultimoLocalBuscado) {
        inputDestino.value = ultimoLocalBuscado;
      }
    }
  }

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => trocarAba(btn.dataset.tab));
  });

  // ---------- Localização ----------

  function exibirMapaInicial(lat, lon) {
    minhaLat = lat;
    minhaLon = lon;
    const url = `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
    exibirIframe(url);
  }

  function obterLocalizacao() {
    if (!navigator.geolocation) {
      setStatus("Geolocalização não suportada neste navegador.", true);
      document.getElementById("map").innerHTML = "<p>Geolocalização não suportada.</p>";
      return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude } = pos.coords;
      exibirMapaInicial(latitude, longitude);
    }, err => {
      setStatus("Permissão de localização negada ou erro ao obter posição.", true);
      document.getElementById("map").innerHTML = "<p>Permissão de localização negada ou erro ao obter posição.</p>";
    }, {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    });
  }

  // ---------- Buscar local ----------

  function buscarLocal() {
    const local = document.getElementById("input-busca").value.trim();
    if (!local) {
      setStatus("Digite um local!", true);
      return;
    }

    setStatus("Buscando local...");
    geocodificar(local).then(res => {
      if (!res) {
        setStatus("Local não encontrado.", true);
        return;
      }
      const url = `https://maps.google.com/maps?q=${res.lat},${res.lon}&z=15&output=embed`;
      exibirIframe(url);
      ultimoLocalBuscado = local;
      setStatus(`Local encontrado: ${res.nome}`);
    }).catch(err => {
      console.error(err);
      setStatus("Erro ao buscar local.", true);
    });
  }

  document.getElementById("input-busca").addEventListener("keydown", e => {
    if (e.key === "Enter") buscarLocal();
  });

  // ---------- Traçar rota ----------

  function tracarRota() {
    const destino = document.getElementById("input-destino").value.trim();
    const dirflg = document.getElementById("modo-transporte").value;

    if (!destino) {
      setStatus("Digite um destino!", true);
      return;
    }

    if (minhaLat === null || minhaLon === null) {
      setStatus("Ainda não foi possível obter sua localização atual. Aguarde ou verifique a permissão de GPS.", true);
      return;
    }

    setStatus("Calculando rota...");

    geocodificar(destino).then(res => {
      if (!res) {
        setStatus("Destino não encontrado.", true);
        return;
      }
      const saddr = `${minhaLat},${minhaLon}`;
      const daddr = `${res.lat},${res.lon}`;
      const url = `https://maps.google.com/maps?saddr=${saddr}&daddr=${daddr}&dirflg=${dirflg}&output=embed`;
      exibirIframe(url);
      setStatus(`Rota traçada até: ${res.nome}`);
    }).catch(err => {
      console.error(err);
      setStatus("Erro ao calcular rota.", true);
    });
  }

  document.getElementById("input-destino").addEventListener("keydown", e => {
    if (e.key === "Enter") tracarRota();
  });

  // ---------- Início ----------

  obterLocalizacao();
</script>

</body>
</html>
