<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Motorola F3</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;
  font-family:'Share Tech Mono',monospace;
}
.body{
  background:#1a1c22;
  width:230px;
  border-radius:20px 20px 24px 24px;
  padding:10px 12px 20px;
  border:1.5px solid #2e3040;
  box-shadow:inset 0 2px 2px #2e3040,inset 0 -2px 2px #0a0b0e,3px 6px 18px #000;
  position:relative;
}
.top-bar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:6px;padding:0 2px;
}
.signal-bars{display:flex;align-items:flex-end;gap:2px;}
.signal-bars span{width:3px;background:#555;border-radius:1px;}
.signal-bars span:nth-child(1){height:4px;}
.signal-bars span:nth-child(2){height:6px;}
.signal-bars span:nth-child(3){height:9px;}
.signal-bars span:nth-child(4){height:12px;}
.moto-logo{
  width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff 0%,#ccc 40%,#888 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:0.55rem;font-weight:900;color:#111;
  font-family:Arial,sans-serif;
  border:1px solid #555;
}

/* DISPLAY */
.display-shell{
  background:#0d0d0d;
  border-radius:5px;padding:5px 5px 4px;
  margin-bottom:8px;border:1px solid #111;
}
.display{
  background:#b8c0ac;
  border-radius:3px;
  height:190px;
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  gap:4px;position:relative;overflow:hidden;
}
.display::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,rgba(0,0,0,0.06) 0px,rgba(0,0,0,0.06) 1px,
    transparent 1px,transparent 3px
  );pointer-events:none;
}
.d-hora{
  font-family:'Share Tech Mono',monospace;
  font-size:2.8rem;font-weight:400;
  color:#1a1f18;
  letter-spacing:6px;line-height:1;
  text-shadow:1px 1px 0 rgba(0,0,0,0.15);
}
.d-data{
  font-family:'Share Tech Mono',monospace;
  font-size:0.7rem;color:#4a5545;letter-spacing:2px;
}

/* NAV */
.nav-area{
  display:grid;
  grid-template-columns:36px 1fr 36px;
  grid-template-rows:28px 80px 28px;
  gap:2px;margin-bottom:7px;
  align-items:center;justify-items:center;
}
.nav-sq{
  width:32px;height:26px;
  background:#22242c;border:1px solid #33364a;
  border-bottom:2px solid #0a0a0f;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#aaa;font-size:0.75rem;
}
.nav-sq:active{background:#2a2c38;transform:translateY(1px);border-bottom:1px solid #0a0a0f;}
.nav-sq.green{background:#0d2010;border-color:#1a4020;border-bottom-color:#050f08;}
.nav-sq.red{background:#200d0d;border-color:#401a1a;border-bottom-color:#0f0505;}
.nav-sq svg{display:block;}

.dpad-wrap{
  grid-column:2;grid-row:1/4;
  width:84px;height:84px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.dpad-ring{
  width:84px;height:84px;border-radius:50%;
  background:conic-gradient(from 0deg,#3a3a3a,#999,#ddd,#999,#bbb,#666,#aaa,#666,#3a3a3a);
  border:2px solid #111;position:absolute;
  box-shadow:0 2px 8px #000,inset 0 1px 2px rgba(255,255,255,0.15);
}
.dpad-center{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,#ccc,#888 55%,#444);
  border:1.5px solid #222;position:relative;z-index:2;
  box-shadow:0 1px 4px #000;
}
.dpad-arrow{
  position:absolute;z-index:3;
  display:flex;align-items:center;justify-content:center;
  color:#333;font-size:0.5rem;cursor:pointer;user-select:none;
  width:18px;height:18px;
}
.dpad-arrow.up   {top:3px;left:50%;transform:translateX(-50%);}
.dpad-arrow.down {bottom:3px;left:50%;transform:translateX(-50%);}
.dpad-arrow.left {left:3px;top:50%;transform:translateY(-50%);}
.dpad-arrow.right{right:3px;top:50%;transform:translateY(-50%);}

/* TECLADO */
.teclado{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid #2a2a2a;border-left:1px solid #2a2a2a;
  border-radius:5px;overflow:hidden;margin-bottom:6px;
}
.key{
  background:#1e2028;
  border-right:1px solid #2a2a2a;border-bottom:1px solid #2a2a2a;
  height:30px;cursor:pointer;
  display:flex;align-items:center;padding:0 5px;gap:3px;
}
.key:nth-child(3n){border-right:none;}
.key:nth-child(10),.key:nth-child(11),.key:nth-child(12){border-bottom:none;}
.key:active{background:#26282e;}
.key-num{
  font-family:'Share Tech Mono',monospace;
  font-size:1rem;font-weight:bold;color:#e0e0e0;min-width:13px;
}
.key-sub{
  font-size:0.42rem;color:#666;letter-spacing:0.3px;
  line-height:1.3;font-family:Arial,sans-serif;
}

.mic{display:flex;justify-content:center;gap:3px;margin-top:8px;}
.mic span{width:2px;height:5px;background:#252525;border-radius:1px;}
</style>
</head>
<body>
<div class="body">
  <div class="top-bar">
    <div class="signal-bars"><span></span><span></span><span></span><span></span></div>
    <div class="moto-logo">M</div>
    <div class="signal-bars" style="transform:scaleX(-1)"><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="display-shell">
    <div class="display">
      <div class="d-hora" id="hora">--:--</div>
      <div class="d-data" id="data"></div>
    </div>
  </div>

  <div class="nav-area">
    <div class="nav-sq" style="grid-column:1;grid-row:1;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="nav-sq" style="grid-column:3;grid-row:1;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </div>

    <div class="dpad-wrap">
      <div class="dpad-ring"></div>
      <div class="dpad-arrow up">&#9650;</div>
      <div class="dpad-arrow down">&#9660;</div>
      <div class="dpad-arrow left">&#9664;</div>
      <div class="dpad-arrow right">&#9654;</div>
      <div class="dpad-center"></div>
    </div>

    <div class="nav-sq green" id="ligar" style="grid-column:1;grid-row:2;">
      <svg width="15" height="15" viewBox="0 0 22 22" fill="none" stroke="#4db86a" stroke-width="2.5" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2A19.8 19.8 0 013.08 4.18 2 2 0 015.07 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L9.09 9.91a16 16 0 006.99 7l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/></svg>
    </div>
    <div class="nav-sq red" id="encerrar" style="grid-column:3;grid-row:2;">
      <svg width="15" height="15" viewBox="0 0 22 22" fill="none" stroke="#c04040" stroke-width="2.5" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 01-2.18 2A19.8 19.8 0 013.08 4.18 2 2 0 015.07 2h3a2 2 0 012 1.72c.13.96.36 1.9.68 2.81a2 2 0 01-.45 2.11L9.09 9.91a16 16 0 006.99 7l1.27-1.27a2 2 0 012.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0122 16.92z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </div>

    <div class="nav-sq" style="grid-column:1;grid-row:3;">
      <svg width="14" height="14" viewBox="0 0 22 22" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="nav-sq" id="apagar" style="grid-column:3;grid-row:3;font-size:0.75rem;color:#888;">&#9003;</div>
  </div>

  <div class="teclado" id="teclado">
    <div class="key" data-num="1"><span class="key-num">1</span><span class="key-sub">../</span></div>
    <div class="key" data-num="2"><span class="key-num">2</span><span class="key-sub">ABC</span></div>
    <div class="key" data-num="3" style="flex-direction:row-reverse;"><span class="key-num">3</span><span class="key-sub">DEF</span></div>
    <div class="key" data-num="4"><span class="key-num">4</span><span class="key-sub">GHI</span></div>
    <div class="key" data-num="5"><span class="key-num">5</span><span class="key-sub">JKL</span></div>
    <div class="key" data-num="6" style="flex-direction:row-reverse;"><span class="key-num">6</span><span class="key-sub">MNO</span></div>
    <div class="key" data-num="7"><span class="key-num">7</span><span class="key-sub">PQRS</span></div>
    <div class="key" data-num="8"><span class="key-num">8</span><span class="key-sub">TUV</span></div>
    <div class="key" data-num="9" style="flex-direction:row-reverse;"><span class="key-num">9</span><span class="key-sub">WXYZ</span></div>
    <div class="key" data-num="*"><span class="key-num" style="font-size:.85rem;">*</span><span class="key-sub">&#128274;</span></div>
    <div class="key" data-num="0"><span class="key-num">0</span><span class="key-sub">+</span></div>
    <div class="key" data-num="#" style="flex-direction:row-reverse;"><span class="key-num" style="font-size:.85rem;">#</span><span class="key-sub">&#8747;</span></div>
  </div>

  <div class="mic"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<script>
const horaDiv=document.getElementById('hora');
const dataDiv=document.getElementById('data');
let numero='';

function tick(){
  if(numero.length>0)return;
  const n=new Date();
  const h=String(n.getHours()).padStart(2,'0');
  const m=String(n.getMinutes()).padStart(2,'0');
  const d=String(n.getDate()).padStart(2,'0');
  const mo=String(n.getMonth()+1).padStart(2,'0');
  const y=String(n.getFullYear()).slice(-2);
  horaDiv.textContent=h+':'+m;
  dataDiv.textContent=d+'/'+mo+'/'+y;
}
tick();setInterval(tick,1000);

document.querySelectorAll('#teclado .key').forEach(btn=>{
  btn.addEventListener('click',()=>{
    numero+=btn.getAttribute('data-num');
    horaDiv.style.fontSize=numero.length>7?'1.6rem':'2.8rem';
    horaDiv.textContent=numero;
    dataDiv.textContent='';
  });
});

document.getElementById('apagar').addEventListener('click',()=>{
  numero=numero.slice(0,-1);
  if(!numero){horaDiv.style.fontSize='2.8rem';tick();}
  else{horaDiv.style.fontSize=numero.length>7?'1.6rem':'2.8rem';horaDiv.textContent=numero;}
});

document.getElementById('ligar').addEventListener('click',()=>{
  if(!numero.trim()){dataDiv.textContent='DIGITE NUM';return;}
  window.location.href='tel:'+numero;
});

document.getElementById('encerrar').addEventListener('click',()=>{
  numero='';horaDiv.style.fontSize='2.8rem';tick();
});
</script>
</body>
</html>
