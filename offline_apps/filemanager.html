<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files | Desktop Web</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css"/>
  <style>
    /* ── Tokens (espelha o desktop pai) ── */
    :root {
      --glass-bg:       rgba(30,18,15,0.72);
      --glass-bg-hover: rgba(30,38,25,0.85);
      --glass-border:   rgba(255,255,255,0.22);
      --glass-border-s: rgba(255,255,255,0.38);
      --accent:         rgba(0,120,215,0.95);
      --accent-soft:    rgba(0,120,215,0.28);
      --accent-glow:    rgba(0,140,255,0.4);
      --text:           #f0f0f0;
      --text-dim:       rgba(255,255,255,0.65);
      --danger:         rgba(220,50,50,0.85);
      --radius:         10px;
      --radius-sm:      6px;
      --font: 'Segoe UI', Arial, sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: var(--font);
      background: rgba(25,13,12,0.82);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 10px 6px;
      background: rgba(8,10,20,0.75);
      border-bottom: 1px solid var(--glass-border);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 11px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font);
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-s);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .btn.danger:hover { background: rgba(220,50,50,0.2); border-color: rgba(220,80,80,0.5); }
    .btn.accent { background: var(--accent); border-color: transparent; }
    .btn.accent:hover { background: rgba(0,140,255,0.95); box-shadow: 0 0 12px var(--accent-glow); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

    .toolbar-sep {
      width: 1px;
      height: 22px;
      background: var(--glass-border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      background: rgba(8,10,20,0.6);
      border-bottom: 1px solid var(--glass-border);
      font-size: 12px;
      color: var(--text-dim);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .breadcrumb::-webkit-scrollbar { display: none; }
    .crumb {
      cursor: pointer;
      color: var(--text-dim);
      transition: color 0.15s;
      white-space: nowrap;
    }
    .crumb:hover { color: var(--text); }
    .crumb.active { color: var(--text); font-weight: 600; cursor: default; }
    .crumb-sep { opacity: 0.35; font-size: 10px; }

    /* ── Barra de busca e ordenação ── */
    .filterbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: rgba(8,10,20,0.55);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }
    .search-wrap i {
      position: absolute;
      left: 9px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 11px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 5px 10px 5px 28px;
      background: rgba(10,13,24,0.7);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--glass-border-s);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .search-input::placeholder { color: var(--text-dim); }

    .sort-select {
      padding: 5px 8px;
      background: rgba(10,13,24,0.7);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .sort-select option { background: #1e2535; }

    .view-toggle {
      display: flex;
      gap: 2px;
    }
    .view-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }
    .view-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

    /* ── Área de conteúdo ── */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .content-area::-webkit-scrollbar { width: 6px; }
    .content-area::-webkit-scrollbar-track { background: transparent; }
    .content-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

    /* ── Modo grade ── */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
      gap: 8px;
    }

    .file-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 6px 8px;
      border-radius: var(--radius);
      background: var(--glass-bg);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      position: relative;
      user-select: none;
    }
    .file-item:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border);
      transform: translateY(-1px);
    }
    .file-item.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .file-icon {
      font-size: 28px;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .file-name {
      font-size: 11px;
      text-align: center;
      word-break: break-word;
      line-height: 1.3;
      max-width: 80px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .file-meta {
      font-size: 9px;
      color: var(--text-dim);
    }

    /* ── Modo lista ── */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      background: var(--glass-bg);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .file-row:hover { background: var(--glass-bg-hover); border-color: var(--glass-border); }
    .file-row.selected { background: var(--accent-soft); border-color: var(--accent); }
    .file-row .file-icon { font-size: 18px; flex-shrink: 0; }
    .file-row .file-name { flex: 1; font-size: 13px; }
    .file-row .file-size { font-size: 11px; color: var(--text-dim); min-width: 60px; text-align: right; }
    .file-row .file-date { font-size: 11px; color: var(--text-dim); min-width: 80px; text-align: right; }

    /* ── Destaque de drop ── */
    .drop-zone {
      border: 2px dashed transparent;
      border-radius: var(--radius);
      transition: border-color 0.2s, background 0.2s;
      min-height: 100%;
    }
    .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    /* ── Vazio ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px;
      color: var(--text-dim);
    }
    .empty-state i { font-size: 40px; opacity: 0.3; }
    .empty-state p { font-size: 13px; }

    /* ── Barra de status ── */
    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      background: rgba(8,10,20,0.75);
      border-top: 1px solid var(--glass-border);
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ── Badge de acesso real ── */
    .fs-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      background: rgba(0,200,80,0.15);
      border: 1px solid rgba(0,200,80,0.35);
      border-radius: 20px;
      font-size: 10px;
      color: rgba(100,255,150,0.9);
    }
    .fs-badge i { font-size: 9px; }

    /* ── Context menu ── */
    .context-menu {
      position: fixed;
      background: rgba(12,15,25,0.97);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--glass-border-s);
      border-radius: var(--radius);
      z-index: 9999;
      min-width: 170px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: none;
      overflow: hidden;
      animation: fadeIn 0.12s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }

    .ctx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: background 0.1s;
    }
    .ctx-item:hover { background: var(--glass-bg-hover); }
    .ctx-item i { width: 14px; text-align: center; color: var(--text-dim); }
    .ctx-item.danger { color: #ff7070; }
    .ctx-item.danger:hover { background: rgba(220,50,50,0.15); }
    .ctx-sep { height: 1px; background: var(--glass-border); margin: 3px 0; }

    /* ── Modal de preview ── */
    .preview-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      flex-direction: column;
      gap: 12px;
    }
    .preview-backdrop.show { display: flex; }

    .preview-box {
      background: rgba(10,13,22,0.98);
      border: 1px solid var(--glass-border-s);
      border-radius: var(--radius);
      max-width: 90vw;
      max-height: 80vh;
      overflow: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--glass-border);
      font-size: 13px;
      font-weight: 600;
    }
    .preview-header button {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .preview-header button:hover { background: var(--glass-bg-hover); color: var(--text); }
    .preview-body { padding: 16px; }
    .preview-body img { max-width: 80vw; max-height: 70vh; display: block; border-radius: 6px; }
    .preview-body iframe { width: 80vw; height: 70vh; border: none; border-radius: 6px; }
    .preview-body pre { max-width: 80vw; overflow-x: auto; font-size: 12px; }
    .preview-nav {
      display: flex;
      gap: 8px;
    }

    /* ── Indicador de carregamento ── */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      padding: 20px;
      justify-content: center;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.8s linear infinite; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(20,22,30,0.95);
      border: 1px solid var(--glass-border-s);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 99999;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Mobile */
    @media (max-width: 500px) {
      .btn span { display: none; }
      .btn { padding: 6px 9px; }
      .file-row .file-date { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── Toolbar ── -->
  <div class="toolbar">
    <button class="btn" id="btnBack" onclick="goBack()" disabled title="Voltar">
      <i class="fa fa-arrow-left"></i><span>Voltar</span>
    </button>
    <button class="btn" onclick="goForward()" id="btnFwd" disabled title="Avançar">
      <i class="fa fa-arrow-right"></i>
    </button>

    <div class="toolbar-sep"></div>

    <button class="btn" onclick="createFolder()">
      <i class="fa fa-folder-plus"></i><span>Nova pasta</span>
    </button>
    <button class="btn" onclick="uploadFiles()">
      <i class="fa fa-upload"></i><span>Upload</span>
    </button>

    <div class="toolbar-sep"></div>
    
    <button class="btn" onclick="importCameraPhotos()">
    <i class="fa fa-camera"></i><span>📷 Importar Fotos da Câmera</span>
    </button>
    
    <div class="toolbar-sep"></div>

    <button class="btn accent" id="btnOpenFS" onclick="openRealFS()" title="Abrir pasta do disco (File System Access API)">
      <i class="fa fa-hard-drive"></i><span>Abrir disco</span>
    </button>

    <div class="toolbar-sep"></div>

    <button class="btn danger" id="btnDelete" onclick="deleteSelected()" disabled>
      <i class="fa fa-trash"></i><span>Excluir</span>
    </button>

    <button class="btn" id="btnRename" onclick="renameSelected()" disabled>
      <i class="fa fa-pencil"></i><span>Renomear</span>
    </button>
  </div>

  <!-- ── Breadcrumb ── -->
  <div class="breadcrumb" id="breadcrumb"></div>

  <!-- ── Filterbar ── -->
  <div class="filterbar">
    <div class="search-wrap">
      <i class="fa fa-search"></i>
      <input class="search-input" id="searchInput" type="text" placeholder="Buscar arquivos..." oninput="render()">
    </div>
    <select class="sort-select" id="sortSelect" onchange="render()">
      <option value="name-asc">Nome ↑</option>
      <option value="name-desc">Nome ↓</option>
      <option value="size-asc">Tamanho ↑</option>
      <option value="size-desc">Tamanho ↓</option>
      <option value="type-asc">Tipo ↑</option>
    </select>
    <div class="view-toggle">
      <div class="view-btn active" id="viewGrid" onclick="setView('grid')" title="Grade"><i class="fa fa-grip"></i></div>
      <div class="view-btn" id="viewList" onclick="setView('list')" title="Lista"><i class="fa fa-list"></i></div>
    </div>
  </div>

  <!-- ── Conteúdo ── -->
  <div class="content-area" id="contentArea">
    <div class="drop-zone" id="dropZone">
      <div class="file-grid" id="fileGrid"></div>
    </div>
  </div>

  <!-- ── Statusbar ── -->
  <div class="statusbar">
    <span id="statusLeft">Pronto</span>
    <span id="statusRight"></span>
  </div>

  <!-- ── Context menu ── -->
  <div class="context-menu" id="ctxMenu">
    <div class="ctx-item" onclick="openSelected()"><i class="fa fa-folder-open"></i> Abrir</div>
    <div class="ctx-item" onclick="previewSelected()"><i class="fa fa-eye"></i> Pré-visualizar</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="renameSelected()"><i class="fa fa-pencil"></i> Renomear</div>
    <div class="ctx-item" onclick="downloadSelected()"><i class="fa fa-download"></i> Baixar</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" onclick="deleteSelected()"><i class="fa fa-trash"></i> Excluir</div>
  </div>

  <!-- ── Preview modal ── -->
  <div class="preview-backdrop" id="previewBackdrop" onclick="closePreview(event)">
    <div class="preview-box" onclick="event.stopPropagation()">
      <div class="preview-header">
        <span id="previewTitle">Preview</span>
        <div style="display:flex;gap:6px;">
          <button onclick="navigatePreview(-1)" title="Anterior"><i class="fa fa-arrow-left"></i></button>
          <button onclick="navigatePreview(1)" title="Próximo"><i class="fa fa-arrow-right"></i></button>
          <button onclick="closePreview()" title="Fechar"><i class="fa fa-xmark"></i></button>
        </div>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </div>
  </div>

  <!-- Inputs ocultos -->
  <input type="file" id="fileInput" style="display:none" multiple>
  <div id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
  // ════════════════════════════════════════════════════════════
  //  ESTADO
  // ════════════════════════════════════════════════════════════

  // Dois modos: virtual (array em memória) e real (File System Access API)
  let mode = 'virtual'; // 'virtual' | 'real'
  let realDirHandle = null; // FileSystemDirectoryHandle raiz
  let realCurrentHandle = null; // handle da pasta atual (modo real)

  // Modo virtual — estrutura em árvore
  let root = [
    { isDir:true, name:'Documentos', children:[], date: new Date() },
    { isDir:true, name:'Imagens', children:[], date: new Date() },
    { isDir:false, name:'readme.txt',
      file: new File(['Bem-vindo ao Files!\n\nEste gerenciador suporta o disco real via File System Access API.\nClique em "Abrir disco" na barra de ferramentas para começar.'], 'readme.txt', {type:'text/plain'}),
      date: new Date() }
  ];

  let currentPath   = [];   // modo virtual
  let historyStack  = [];   // para navegação avançar
  let backStack     = [];   // para botão voltar (virtual)

  let selectedIndex = null; // índice no array atual
  let previewIndex  = null;
  let currentView   = 'grid';

  // Cache de itens renderizados (filtrados+ordenados)
  let renderedItems = [];

  // ════════════════════════════════════════════════════════════
  //  HELPERS
  // ════════════════════════════════════════════════════════════

  function getIconForItem(item) {
    if (item.isDir) return '📁';
    const ext = (item.name.split('.').pop() || '').toLowerCase();
    const map = {
      // Imagens
      jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', svg:'🖼️', webp:'🖼️', bmp:'🖼️',
      // Vídeo
      mp4:'🎬', mkv:'🎬', avi:'🎬', mov:'🎬', webm:'🎬',
      // Áudio
      mp3:'🎵', wav:'🎵', ogg:'🎵', flac:'🎵', m4a:'🎵',
      // Docs
      pdf:'📕', doc:'📝', docx:'📝', odt:'📝',
      xls:'📊', xlsx:'📊', ods:'📊',
      ppt:'📽️', pptx:'📽️',
      txt:'📄', md:'📋', markdown:'📋',
      // Código
      html:'🌐', htm:'🌐', css:'🎨', js:'📜', ts:'📜',
      json:'🔧', xml:'🔧', yaml:'🔧', yml:'🔧',
      py:'🐍', php:'🐘', java:'☕', cpp:'⚙️', c:'⚙️', sh:'⚙️',
      // Arquivo
      zip:'📦', rar:'📦', tar:'📦', gz:'📦',
      // Outros
      exe:'⚙️', apk:'📱',
    };
    return map[ext] || '📄';
  }

  function formatSize(bytes) {
    if (!bytes && bytes !== 0) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + ' MB';
    return (bytes/1024/1024/1024).toFixed(2) + ' GB';
  }

  function formatDate(date) {
    if (!date) return '';
    const d = new Date(date);
    return d.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit'});
  }

  function toast(msg, duration = 2200) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  // ════════════════════════════════════════════════════════════
  //  MODO VIRTUAL — navegação
  // ════════════════════════════════════════════════════════════

  function getCurrentDir() {
    let dir = root;
    for (const seg of currentPath) {
      const f = dir.find(x => x.isDir && x.name === seg);
      if (!f) return [];
      dir = f.children;
    }
    return dir;
  }

  // ════════════════════════════════════════════════════════════
  //  MODO REAL — File System Access API
  // ════════════════════════════════════════════════════════════

  async function openRealFS() {
    if (!('showDirectoryPicker' in window)) {
      toast('❌ Seu navegador não suporta File System Access API. Use Chrome ou Edge.');
      return;
    }
    try {
      realDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      realCurrentHandle = realDirHandle;
      mode = 'real';
      currentPath = [realDirHandle.name];
      backStack = [];
      historyStack = [];
      selectedIndex = null;
      await renderReal();
      updateStatus();
      toast('✅ Disco aberto: ' + realDirHandle.name);
    } catch(e) {
      if (e.name !== 'AbortError') toast('Erro ao abrir pasta: ' + e.message);
    }
  }

  async function getRealItems() {
    const items = [];
    for await (const [name, handle] of realCurrentHandle.entries()) {
      let size = 0, date = null;
      if (handle.kind === 'file') {
        try {
          const f = await handle.getFile();
          size = f.size;
          date = new Date(f.lastModified);
        } catch(_) {}
      }
      items.push({ isDir: handle.kind === 'directory', name, handle, size, date });
    }
    return items;
  }

  async function enterRealDir(handle) {
    backStack.push({ handle: realCurrentHandle, path: [...currentPath] });
    historyStack = [];
    realCurrentHandle = handle;
    currentPath.push(handle.name);
    selectedIndex = null;
    await renderReal();
  }

  async function renderReal() {
    showLoading();
    try {
      const raw = await getRealItems();
      renderedItems = applyFilterSort(raw);
      buildUI(renderedItems);
    } catch(e) {
      showEmpty('Erro ao ler pasta: ' + e.message);
    }
    updateBreadcrumb();
    updateNavButtons();
    updateStatus();
  }

  async function goBackReal() {
    if (!backStack.length) return;
    const prev = backStack.pop();
    historyStack.push({ handle: realCurrentHandle, path: [...currentPath] });
    realCurrentHandle = prev.handle;
    currentPath = prev.path;
    selectedIndex = null;
    await renderReal();
  }

  async function goForwardReal() {
    if (!historyStack.length) return;
    const next = historyStack.pop();
    backStack.push({ handle: realCurrentHandle, path: [...currentPath] });
    realCurrentHandle = next.handle;
    currentPath = next.path;
    selectedIndex = null;
    await renderReal();
  }

  // ════════════════════════════════════════════════════════════
  //  RENDERIZAÇÃO UNIFICADA
  // ════════════════════════════════════════════════════════════

  function applyFilterSort(items) {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const sort = document.getElementById('sortSelect').value;
    let list = q ? items.filter(i => i.name.toLowerCase().includes(q)) : [...items];

    // Pastas primeiro, depois arquivos
    const dirs  = list.filter(i => i.isDir);
    const files = list.filter(i => !i.isDir);

    const sortFn = (a, b) => {
      if (sort === 'name-asc')  return a.name.localeCompare(b.name);
      if (sort === 'name-desc') return b.name.localeCompare(a.name);
      if (sort === 'size-asc')  return (a.size||0) - (b.size||0);
      if (sort === 'size-desc') return (b.size||0) - (a.size||0);
      if (sort === 'type-asc')  return a.name.split('.').pop().localeCompare(b.name.split('.').pop());
      return 0;
    };
    dirs.sort(sortFn);
    files.sort(sortFn);
    return [...dirs, ...files];
  }

  function showLoading() {
    document.getElementById('fileGrid').innerHTML = '';
    document.getElementById('fileGrid').innerHTML =
      '<div class="loading" style="grid-column:1/-1"><i class="fa fa-circle-notch spinner"></i> Carregando...</div>';
  }

  function showEmpty(msg = 'Pasta vazia') {
    document.getElementById('fileGrid').innerHTML =
      `<div class="empty-state" style="grid-column:1/-1"><i class="fa fa-folder-open"></i><p>${msg}</p></div>`;
  }

  function buildUI(items) {
    const grid = document.getElementById('fileGrid');
    grid.className = currentView === 'grid' ? 'file-grid' : 'file-list';
    grid.innerHTML = '';

    if (!items.length) { showEmpty(); return; }

    items.forEach((item, idx) => {
      const icon = getIconForItem(item);
      const el = currentView === 'grid' ? buildGridItem(item, idx, icon) : buildListItem(item, idx, icon);
      grid.appendChild(el);
    });
  }

  function buildGridItem(item, idx, icon) {
    const div = document.createElement('div');
    div.className = 'file-item' + (selectedIndex === idx ? ' selected' : '');
    div.innerHTML = `
      <div class="file-icon">${icon}</div>
      <div class="file-name">${item.name}</div>
      ${item.size ? `<div class="file-meta">${formatSize(item.size)}</div>` : ''}
    `;
    bindItemEvents(div, item, idx);
    return div;
  }

  function buildListItem(item, idx, icon) {
    const div = document.createElement('div');
    div.className = 'file-row' + (selectedIndex === idx ? ' selected' : '');
    div.innerHTML = `
      <span class="file-icon">${icon}</span>
      <span class="file-name">${item.name}</span>
      <span class="file-size">${item.isDir ? '—' : formatSize(item.size)}</span>
      <span class="file-date">${formatDate(item.date)}</span>
    `;
    bindItemEvents(div, item, idx);
    return div;
  }

  function bindItemEvents(el, item, idx) {
    el.onclick = (e) => { e.stopPropagation(); selectItem(idx); };
    el.ondblclick = () => openItem(item);
    el.oncontextmenu = (e) => {
      e.preventDefault();
      selectItem(idx);
      showCtxMenu(e.clientX, e.clientY);
    };
    // Touch long press → context menu
    let pressTimer;
    el.addEventListener('touchstart', () => {
      pressTimer = setTimeout(() => {
        selectItem(idx);
        showCtxMenu(80, 200);
      }, 600);
    }, { passive: true });
    el.addEventListener('touchend', () => clearTimeout(pressTimer));
  }

  async function render() {
    selectedIndex = null;
    updateActionButtons();

    if (mode === 'real') {
      await renderReal();
      return;
    }

    const dir = getCurrentDir();
    renderedItems = applyFilterSort(dir);
    buildUI(renderedItems);
    updateBreadcrumb();
    updateNavButtons();
    updateStatus();
  }

  // ════════════════════════════════════════════════════════════
  //  AÇÕES
  // ════════════════════════════════════════════════════════════

  function selectItem(idx) {
    selectedIndex = idx;
    // Atualiza destaque visual sem re-render completo
    document.querySelectorAll('.file-item, .file-row').forEach((el, i) => {
      el.classList.toggle('selected', i === idx);
    });
    updateActionButtons();
  }

  async function openItem(item) {
    if (item.isDir) {
      if (mode === 'real') {
        await enterRealDir(item.handle);
      } else {
        backStack.push([...currentPath]);
        historyStack = [];
        currentPath.push(item.name);
        selectedIndex = null;
        render();
      }
    } else {
      previewIndex = selectedIndex;
      await previewItem(item);
    }
  }

  async function openSelected() {
    if (selectedIndex == null) return;
    openItem(renderedItems[selectedIndex]);
    hideCtxMenu();
  }

  function updateActionButtons() {
    const hasSel = selectedIndex != null;
    document.getElementById('btnDelete').disabled = !hasSel;
    document.getElementById('btnRename').disabled = !hasSel;
  }

  async function goBack() {
    if (mode === 'real') { await goBackReal(); return; }
    if (!backStack.length) return;
    historyStack.push([...currentPath]);
    currentPath = backStack.pop();
    selectedIndex = null;
    render();
  }

  async function goForward() {
    if (mode === 'real') { await goForwardReal(); return; }
    if (!historyStack.length) return;
    backStack.push([...currentPath]);
    currentPath = historyStack.pop();
    selectedIndex = null;
    render();
  }

  async function createFolder() {
    const name = prompt('Nome da nova pasta:');
    if (!name || !name.trim()) return;
    const safeName = name.trim();

    if (mode === 'real') {
      try {
        await realCurrentHandle.getDirectoryHandle(safeName, { create: true });
        toast('📁 Pasta criada: ' + safeName);
        await renderReal();
      } catch(e) { toast('Erro: ' + e.message); }
    } else {
      const dir = getCurrentDir();
      if (dir.some(x => x.name === safeName)) { toast('Já existe um item com esse nome.'); return; }
      dir.push({ isDir:true, name:safeName, children:[], date: new Date() });
      render();
    }
  }

  function uploadFiles() {
    document.getElementById('fileInput').click();
  }

  document.getElementById('fileInput').onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    if (mode === 'real') {
      let ok = 0;
      for (const f of files) {
        try {
          const fh = await realCurrentHandle.getFileHandle(f.name, { create: true });
          const writable = await fh.createWritable();
          await writable.write(f);
          await writable.close();
          ok++;
        } catch(err) { toast('Erro ao salvar ' + f.name + ': ' + err.message); }
      }
      toast(`✅ ${ok} arquivo(s) salvo(s) no disco`);
      await renderReal();
    } else {
      const dir = getCurrentDir();
      files.forEach(f => dir.push({ isDir:false, name:f.name, file:f, size:f.size, date: new Date(f.lastModified) }));
      render();
      toast(`✅ ${files.length} arquivo(s) adicionado(s)`);
    }
    e.target.value = '';
  };

  async function deleteSelected() {
    if (selectedIndex == null) return;
    hideCtxMenu();
    const item = renderedItems[selectedIndex];
    if (!confirm(`Excluir "${item.name}"?`)) return;

    if (mode === 'real') {
      try {
        await realCurrentHandle.removeEntry(item.name, { recursive: true });
        toast('🗑️ Excluído: ' + item.name);
        selectedIndex = null;
        await renderReal();
      } catch(e) { toast('Erro: ' + e.message); }
    } else {
      const dir = getCurrentDir();
      const realIdx = dir.findIndex(x => x.name === item.name);
      if (realIdx > -1) dir.splice(realIdx, 1);
      selectedIndex = null;
      render();
    }
  }

  async function renameSelected() {
    if (selectedIndex == null) return;
    hideCtxMenu();
    const item = renderedItems[selectedIndex];
    const newName = prompt('Novo nome:', item.name);
    if (!newName || !newName.trim() || newName.trim() === item.name) return;
    const safeName = newName.trim();

    if (mode === 'real') {
      // File System Access API não tem rename nativo ainda — workaround: copia + deleta
      try {
        if (!item.isDir) {
          const oldFile = await item.handle.getFile();
          const newHandle = await realCurrentHandle.getFileHandle(safeName, { create: true });
          const writable  = await newHandle.createWritable();
          await writable.write(oldFile);
          await writable.close();
          await realCurrentHandle.removeEntry(item.name);
          toast('✏️ Renomeado para: ' + safeName);
          selectedIndex = null;
          await renderReal();
        } else {
          toast('⚠️ Renomear pastas no disco requer mover todos os arquivos. Não suportado ainda.');
        }
      } catch(e) { toast('Erro: ' + e.message); }
    } else {
      item.name = safeName;
      if (item.file) item.file = new File([item.file], safeName, { type: item.file.type });
      render();
    }
  }

  async function downloadSelected() {
    if (selectedIndex == null) return;
    hideCtxMenu();
    const item = renderedItems[selectedIndex];
    if (item.isDir) { toast('Não é possível baixar pastas diretamente.'); return; }

    let blob;
    if (mode === 'real') {
      blob = await item.handle.getFile();
    } else {
      blob = item.file;
    }
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: item.name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ════════════════════════════════════════════════════════════
  //  PREVIEW
  // ════════════════════════════════════════════════════════════

  async function previewSelected() {
    if (selectedIndex == null) return;
    hideCtxMenu();
    previewIndex = selectedIndex;
    await previewItem(renderedItems[selectedIndex]);
  }

  async function previewItem(item) {
    if (item.isDir) { openItem(item); return; }
    const body = document.getElementById('previewBody');
    document.getElementById('previewTitle').textContent = item.name;
    body.innerHTML = '<div class="loading"><i class="fa fa-circle-notch spinner"></i> Carregando...</div>';
    document.getElementById('previewBackdrop').classList.add('show');

    let file;
    if (mode === 'real') {
      try { file = await item.handle.getFile(); }
      catch(e) { body.innerHTML = '<p style="color:#ff7070">Erro ao ler arquivo.</p>'; return; }
    } else {
      file = item.file;
    }

    const ext = item.name.split('.').pop().toLowerCase();
    const reader = new FileReader();

    reader.onload = (e) => {
      const content = e.target.result;
      if (['jpg','jpeg','png','gif','svg','webp','bmp'].includes(ext)) {
        body.innerHTML = `<img src="${content}" alt="${item.name}">`;
      } else if (ext === 'pdf') {
        const url = URL.createObjectURL(file);
        body.innerHTML = `<iframe src="${url}"></iframe>`;
      } else if (['mp4','webm'].includes(ext)) {
        const url = URL.createObjectURL(file);
        body.innerHTML = `<video controls style="max-width:80vw;max-height:70vh;border-radius:6px"><source src="${url}"></video>`;
      } else if (['mp3','ogg','wav','m4a'].includes(ext)) {
        const url = URL.createObjectURL(file);
        body.innerHTML = `<audio controls style="width:100%;margin:20px 0"><source src="${url}"></audio>`;
      } else if (['md','markdown'].includes(ext)) {
        body.innerHTML = `<div style="max-width:75ch;line-height:1.7;font-size:14px">${marked.parse(content)}</div>`;
      } else if (['js','html','htm','css','json','txt','py','sh','xml','yaml','yml','ts','tsx','jsx','cpp','c','java','php'].includes(ext)) {
        body.innerHTML = `<pre><code class="language-${ext}">${content.replace(/</g,'&lt;')}</code></pre>`;
        hljs.highlightAll();
      } else {
        body.innerHTML = `<pre style="white-space:pre-wrap;word-break:break-word">${content}</pre>`;
      }
    };

    if (file.type.startsWith('image/')) reader.readAsDataURL(file);
    else reader.readAsText(file);
  }

  async function navigatePreview(dir) {
    const files = renderedItems.filter(i => !i.isDir);
    const currentFile = renderedItems[previewIndex];
    if (!currentFile) return;
    const fileIdx = files.findIndex(f => f.name === currentFile.name);
    const newFileIdx = fileIdx + dir;
    if (newFileIdx < 0 || newFileIdx >= files.length) return;
    const newItem = files[newFileIdx];
    previewIndex = renderedItems.findIndex(i => i.name === newItem.name);
    selectedIndex = previewIndex;
    await previewItem(newItem);
  }

  function closePreview(e) {
    if (!e || e.target === document.getElementById('previewBackdrop')) {
      document.getElementById('previewBackdrop').classList.remove('show');
    }
  }

  // ════════════════════════════════════════════════════════════
  //  CONTEXT MENU
  // ════════════════════════════════════════════════════════════

  function showCtxMenu(x, y) {
    const m = document.getElementById('ctxMenu');
    m.style.display = 'block';
    const mw = m.offsetWidth, mh = m.offsetHeight;
    const vw = window.innerWidth, vh = window.innerHeight;
    m.style.left = Math.min(x, vw - mw - 8) + 'px';
    m.style.top  = Math.min(y, vh - mh - 8) + 'px';
  }

  function hideCtxMenu() {
    document.getElementById('ctxMenu').style.display = 'none';
  }

  document.addEventListener('click', hideCtxMenu);

  // ════════════════════════════════════════════════════════════
  //  DRAG & DROP DE ARQUIVOS EXTERNOS
  // ════════════════════════════════════════════════════════════

  const dropZone = document.getElementById('dropZone');

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', async (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files);
    if (!files.length) return;

    if (mode === 'real') {
      let ok = 0;
      for (const f of files) {
        try {
          const fh = await realCurrentHandle.getFileHandle(f.name, { create: true });
          const wr = await fh.createWritable();
          await wr.write(f);
          await wr.close();
          ok++;
        } catch(err) { console.error(err); }
      }
      toast(`✅ ${ok} arquivo(s) salvo(s) no disco`);
      await renderReal();
    } else {
      const dir = getCurrentDir();
      files.forEach(f => dir.push({ isDir:false, name:f.name, file:f, size:f.size, date:new Date(f.lastModified) }));
      render();
      toast(`✅ ${files.length} arquivo(s) adicionado(s)`);
    }
  });

  // ════════════════════════════════════════════════════════════
  //  UI: BREADCRUMB / STATUS / BOTÕES
  // ════════════════════════════════════════════════════════════

  function updateBreadcrumb() {
    const bc = document.getElementById('breadcrumb');
    const segs = mode === 'real' ? currentPath : ['Início', ...currentPath];

    bc.innerHTML = '';
    segs.forEach((seg, i) => {
      const span = document.createElement('span');
      span.className = 'crumb' + (i === segs.length - 1 ? ' active' : '');
      span.textContent = i === 0 && mode === 'virtual' ? '🏠 Início' :
                         i === 0 && mode === 'real'    ? '💾 ' + seg : seg;
      if (i < segs.length - 1) {
        span.onclick = () => {
          if (mode === 'virtual') {
            backStack.push([...currentPath]);
            currentPath = currentPath.slice(0, i);
            selectedIndex = null;
            render();
          }
          // No modo real, breadcrumb requer subir N vezes — simplificado
        };
      }
      bc.appendChild(span);
      if (i < segs.length - 1) {
        const sep = document.createElement('span');
        sep.className = 'crumb-sep';
        sep.textContent = '›';
        bc.appendChild(sep);
      }
    });

    // Badge modo real
    if (mode === 'real') {
      const badge = document.createElement('span');
      badge.className = 'fs-badge';
      badge.innerHTML = '<i class="fa fa-check-circle"></i> Disco real';
      badge.style.marginLeft = 'auto';
      bc.appendChild(badge);
    }
  }

  function updateNavButtons() {
    document.getElementById('btnBack').disabled = mode === 'real' ? !backStack.length : !backStack.length;
    document.getElementById('btnFwd').disabled  = !historyStack.length;
  }

  function updateStatus() {
    const total  = renderedItems.length;
    const dirs   = renderedItems.filter(i => i.isDir).length;
    const files  = total - dirs;
    const selItem = selectedIndex != null ? renderedItems[selectedIndex] : null;

    document.getElementById('statusLeft').textContent =
      `${dirs} pasta${dirs!==1?'s':''}, ${files} arquivo${files!==1?'s':''}`;

    document.getElementById('statusRight').textContent =
      selItem ? selItem.name + (selItem.size ? ' · ' + formatSize(selItem.size) : '') : '';
  }

  function setView(v) {
    currentView = v;
    document.getElementById('viewGrid').classList.toggle('active', v === 'grid');
    document.getElementById('viewList').classList.toggle('active', v === 'list');
    buildUI(renderedItems);
  }

  // ════════════════════════════════════════════════════════════
  //  IMPORTAR FOTOS DA CÂMERA (compatibilidade com sistema atual)
  // ════════════════════════════════════════════════════════════

  function importCameraPhotos(silent = false) {
    let fotos = JSON.parse(localStorage.getItem('cameraPhotos') || '[]');
    if (!fotos.length) {
      if (!silent) toast('Não há fotos para importar.');
      return;
    }
    const dir = getCurrentDir();
    fotos.forEach(({ name, dataUrl }) => {
      const arr = dataUrl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      const file = new File([new Blob([u8],{type:mime})], name, {type:mime});
      dir.push({ isDir:false, name, file, size:file.size, date: new Date() });
    });
    localStorage.removeItem('cameraPhotos');
    render();
    toast(`✅ ${fotos.length} foto(s) importada(s) automaticamente`);
  }

  // ════════════════════════════════════════════════════════════
  //  AUTO-IMPORT: detecta fotos novas da câmera sem precisar clicar
  // ════════════════════════════════════════════════════════════

  // Dispara quando OUTRA aba/iframe (ex: camera.html) grava no localStorage.
  // Só importa automaticamente no modo virtual, pra não misturar com o disco real.
  window.addEventListener('storage', (e) => {
    if (e.key === 'cameraPhotos' && e.newValue && mode === 'virtual') {
      importCameraPhotos(true);
    }
  });

  // Fallback por polling: cobre casos (ex: alguns WebViews Android) onde o
  // evento 'storage' não dispara entre iframes de forma confiável.
  let lastCameraPhotosSnapshot = localStorage.getItem('cameraPhotos') || '[]';
  setInterval(() => {
    const current = localStorage.getItem('cameraPhotos') || '[]';
    if (current !== lastCameraPhotosSnapshot && current !== '[]' && mode === 'virtual') {
      importCameraPhotos(true);
    }
    lastCameraPhotosSnapshot = localStorage.getItem('cameraPhotos') || '[]';
  }, 2000);

  // Também importa qualquer foto pendente assim que o gerenciador abre.
  importCameraPhotos(true);

  // ════════════════════════════════════════════════════════════
  //  ATALHO DE TECLADO
  // ════════════════════════════════════════════════════════════

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' && selectedIndex != null) deleteSelected();
    if (e.key === 'F2' && selectedIndex != null) renameSelected();
    if (e.key === 'Escape') {
      closePreview();
      hideCtxMenu();
    }
    if (e.key === 'Backspace' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault();
      goBack();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  });

  // ════════════════════════════════════════════════════════════
  //  INIT
  // ════════════════════════════════════════════════════════════
  render();
  </script>
</body>
