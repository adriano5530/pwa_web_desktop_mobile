<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>bloco-notas-offline-editor</title>
<link rel="manifest" id="dynamic-manifest">
<style>
  :root{--bg:#ffffff;--text:#000000}
  [data-theme="dark"]{--bg:#0f1115;--text:#c8ccd4}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,monospace}
  header{display:flex;align-items:center;gap:12px;background:transparent;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04)}
  h1{margin:0;font-size:18px}
  .menu{position:relative}
  .menu > button{background:#111217;color:var(--text);border:none;padding:8px 12px;border-radius:6px;cursor:pointer}
  .menu-content{display:none;position:absolute;left:0;top:38px;background:var(--bg);color:var(--text);box-shadow:0 6px 18px rgba(2,6,23,0.6);border-radius:6px;overflow:hidden;min-width:200px;z-index:10}
  .menu-content.show{display:block}
  .menu-content a{display:block;padding:8px 12px;text-decoration:none;color:var(--text);cursor:pointer}
  .menu-content a:hover{background:rgba(255,255,255,0.08)}
  main{padding:18px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .editor-wrap{width:100%;max-width:1100px;display:grid;gap:12px;align-items:start}
  .panel{background:transparent;border-radius:8px;border:1px solid rgba(255,255,255,0.04);padding:8px;min-height:420px;box-sizing:border-box;width:100%}
  .fallback-editor{position:relative;height:420px;display:flex;flex-direction:column}
  .fallback-textarea{position:absolute;inset:0;background:transparent;color:transparent;caret-color:var(--text);border:none;padding:12px;font-family:monospace;font-size:13px;resize:none;outline:none;overflow:auto;white-space:pre;z-index:2}
  .fallback-highlight{position:absolute;inset:0;padding:12px;pointer-events:none;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;overflow:auto;z-index:1;border-radius:6px}
  #status{height:20px;color:#6fcf97;min-height:20px;text-align:center;font-size:14px}
  .tok-comment{color:#5c6370;font-style:italic}
  .tok-keyword{color:#c678dd}
  .tok-string{color:#98c379}
  .tok-number{color:#d19a66}
  .tok-fn{color:#61aeee}
  .tok-attr{color:#e6c07b}
  .tok-tag{color:#e06c75}
  .tok-plain{color:var(--text)}
  @media (max-width:900px){
    .fallback-textarea,.fallback-highlight{font-size:12px}
  }
  .top-right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.04);padding:6px 10px;border-radius:6px;color:var(--text);cursor:pointer}

  /* abas */
  .tabs{display:flex;gap:6px;padding:0 18px;margin-top:4px}
  .tab{background:transparent;border:1px solid rgba(255,255,255,0.06);border-bottom:none;padding:7px 14px;border-radius:8px 8px 0 0;color:var(--text);cursor:pointer;opacity:.6;font-size:13px}
  .tab.active{opacity:1;background:rgba(255,255,255,0.05)}

  /* barra de contexto (linguagem / intenção) */
  .context-bar{width:100%;max-width:1100px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 4px}
  .lang-select{background:#111217;color:var(--text);border:1px solid rgba(255,255,255,0.06);padding:6px 10px;border-radius:6px;font-size:13px;cursor:pointer}
  .blocks-bar{width:100%;max-width:1100px;display:flex;flex-wrap:wrap;gap:6px;padding:0 4px;min-height:30px}
  .sem-block{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.06);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text);white-space:nowrap}
  .sem-block:hover{background:rgba(255,255,255,0.16)}
  .sem-block:active{transform:scale(0.96)}
  .hidden{display:none !important}
</style>
</head>
<body>
<header>
  <h1>📝 bloco-notas-offline-editor</h1>
  <div class="top-right">
    <div class="menu">
      <button id="menuBtn" aria-haspopup="true">📂 Arquivo ▾</button>
      <div class="menu-content" id="menuContent" role="menu">
        <a onclick="salvarNota()">💾 Salvar</a>
        <a onclick="apagarNota()">🧹 Apagar</a>
        <a onclick="exportarTXT()">⬇️ Exportar .txt</a>
        <a onclick="exportarHTML()">⬇️ Exportar .html</a>
        <a onclick="document.getElementById('arquivoInput').click()">📄 Abrir .txt</a>
        <a onclick="alternarTema()">🌓 Alternar Tema</a>
        <a onclick="refine('simplify')" id="menuSimplificar" class="hidden">🔧 Simplificar texto</a>
        <a onclick="refine('formalize')" id="menuFormalizar" class="hidden">🎓 Formalizar texto</a>
        <a onclick="shareText()" id="menuCompartilhar" class="hidden">📤 Compartilhar</a>
      </div>
    </div>
    <button class="btn" onclick="mostrarSobre()">❔</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tabCodigo" onclick="trocarAba('codigo')">💻 Código</button>
  <button class="tab" id="tabSemantico" onclick="trocarAba('semantico')">🧩 Semântico</button>
</div>

<main>
  <div class="context-bar" id="contextBarCodigo">
    <label for="langSelect" style="font-size:13px;opacity:.8">Linguagem:</label>
    <select class="lang-select" id="langSelect" onchange="mudarLinguagemManual(this.value)">
      <option value="">Texto simples</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="java">Java</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="csharp">C#</option>
      <option value="rust">Rust</option>
    </select>
  </div>

  <div class="context-bar hidden" id="contextBarSemantico">
    <button class="btn" onclick="setIntent('message')">✉️ Mensagem</button>
    <button class="btn" onclick="setIntent('note')">📝 Nota</button>
    <button class="btn" onclick="setIntent('task')">✔️ Tarefa</button>
  </div>

  <div class="blocks-bar" id="blocksBar"></div>

  <div class="editor-wrap">
    <div class="panel">
      <div id="fallback" class="fallback-editor">
        <div id="fallback-highlight" class="fallback-highlight" aria-hidden="true"></div>
        <textarea id="fallback-text" class="fallback-textarea" spellcheck="false" placeholder="Escreva ou cole código aqui..."></textarea>
      </div>
    </div>
  </div>

  <input type="file" id="arquivoInput" accept=".txt,.js,.ts,.jsx,.tsx,.html,.css,.json,.py,.java,.c,.cpp,.cs,.rs" style="display:none" />
  <div id="status"></div>
</main>

<script>
const fileInput = document.getElementById('arquivoInput');
const status = document.getElementById('status');
const fallbackText = document.getElementById('fallback-text');
const fallbackHighlight = document.getElementById('fallback-highlight');
const menuBtn = document.getElementById('menuBtn');
const menuContent = document.getElementById('menuContent');
const tabCodigo = document.getElementById('tabCodigo');
const tabSemantico = document.getElementById('tabSemantico');
const contextBarCodigo = document.getElementById('contextBarCodigo');
const contextBarSemantico = document.getElementById('contextBarSemantico');
const blocksBar = document.getElementById('blocksBar');
const langSelect = document.getElementById('langSelect');
const menuSimplificar = document.getElementById('menuSimplificar');
const menuFormalizar = document.getElementById('menuFormalizar');
const menuCompartilhar = document.getElementById('menuCompartilhar');

let abaAtual = 'codigo';
let intentAtual = null;

menuBtn.addEventListener('click', ()=>{
  menuContent.classList.toggle('show');
});
document.addEventListener('click',(e)=>{
  if(!menuBtn.contains(e.target) && !menuContent.contains(e.target)){
    menuContent.classList.remove('show');
  }
});

const LANGS = { js:'javascript', jsx:'javascript', ts:'javascript', tsx:'javascript', html:'html', htm:'html', css:'css', json:'json', py:'python', java:'java', c:'c', cpp:'cpp', cs:'csharp', rs:'rust' };

// blocos semânticos de TEXTO, por intenção
const TEXT_BLOCKS = {
  message: ["Saudação", "Contexto", "Pedido", "Conclusão"],
  note: ["Ideia", "Detalhe", "Exemplo"],
  task: ["O que fazer", "Prazo", "Observações"]
};

// blocos semânticos de CÓDIGO, por linguagem. value = snippet inserido no cursor.
const CODE_BLOCKS = {
  html: [
    { label:'Esqueleto HTML5', value:'<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n<title>Documento</title>\n</head>\n<body>\n\n</body>\n</html>\n' },
    { label:'<div>', value:'<div>\n\n</div>\n' },
    { label:'<a> link', value:'<a href="#">texto</a>' },
    { label:'<img>', value:'<img src="" alt="">' }
  ],
  css: [
    { label:'Regra de seletor', value:'.classe {\n  \n}\n' },
    { label:'Media query', value:'@media (max-width: 768px) {\n  \n}\n' },
    { label:'Flexbox container', value:'.container {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n' }
  ],
  javascript: [
    { label:'Função', value:'function nome() {\n  \n}\n' },
    { label:'Arrow function', value:'const nome = () => {\n  \n};\n' },
    { label:'If/else', value:'if (condicao) {\n  \n} else {\n  \n}\n' },
    { label:'For', value:'for (let i = 0; i < array.length; i++) {\n  \n}\n' },
    { label:'Try/catch', value:'try {\n  \n} catch (erro) {\n  \n}\n' },
    { label:'console.log', value:'console.log();' }
  ],
  python: [
    { label:'Função (def)', value:'def nome():\n    \n' },
    { label:'Classe', value:'class Nome:\n    def __init__(self):\n        \n' },
    { label:'If/else', value:'if condicao:\n    \nelse:\n    \n' },
    { label:'For', value:'for item in lista:\n    \n' },
    { label:'Try/except', value:'try:\n    \nexcept Exception as erro:\n    \n' },
    { label:'print', value:'print()' }
  ],
  java: [
    { label:'Método', value:'public void nome() {\n    \n}\n' },
    { label:'If/else', value:'if (condicao) {\n    \n} else {\n    \n}\n' },
    { label:'For', value:'for (int i = 0; i < n; i++) {\n    \n}\n' },
    { label:'Try/catch', value:'try {\n    \n} catch (Exception erro) {\n    \n}\n' },
    { label:'System.out.println', value:'System.out.println();' }
  ],
  c: [
    { label:'Função', value:'void nome() {\n    \n}\n' },
    { label:'If/else', value:'if (condicao) {\n    \n} else {\n    \n}\n' },
    { label:'For', value:'for (int i = 0; i < n; i++) {\n    \n}\n' },
    { label:'Verificação de erro', value:'if (resultado != 0) {\n    // tratar erro\n}\n' },
    { label:'printf', value:'printf("");' }
  ],
  cpp: [
    { label:'Função', value:'void nome() {\n    \n}\n' },
    { label:'If/else', value:'if (condicao) {\n    \n} else {\n    \n}\n' },
    { label:'For', value:'for (int i = 0; i < n; i++) {\n    \n}\n' },
    { label:'Try/catch', value:'try {\n    \n} catch (const std::exception& erro) {\n    \n}\n' },
    { label:'std::cout', value:'std::cout << "" << std::endl;' }
  ],
  csharp: [
    { label:'Método', value:'public void Nome()\n{\n    \n}\n' },
    { label:'If/else', value:'if (condicao)\n{\n    \n}\nelse\n{\n    \n}\n' },
    { label:'For', value:'for (int i = 0; i < n; i++)\n{\n    \n}\n' },
    { label:'Try/catch', value:'try\n{\n    \n}\ncatch (Exception erro)\n{\n    \n}\n' },
    { label:'Console.WriteLine', value:'Console.WriteLine();' }
  ],
  rust: [
    { label:'Função', value:'fn nome() {\n    \n}\n' },
    { label:'If/else', value:'if condicao {\n    \n} else {\n    \n}\n' },
    { label:'For', value:'for item in lista {\n    \n}\n' },
    { label:'match/Result', value:'match resultado {\n    Ok(valor) => {\n        \n    },\n    Err(erro) => {\n        \n    },\n}\n' },
    { label:'println!', value:'println!("");' }
  ]
};

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- Abas ---------- */
function trocarAba(aba){
  abaAtual = aba;
  tabCodigo.classList.toggle('active', aba==='codigo');
  tabSemantico.classList.toggle('active', aba==='semantico');
  contextBarCodigo.classList.toggle('hidden', aba!=='codigo');
  contextBarSemantico.classList.toggle('hidden', aba!=='semantico');
  menuSimplificar.classList.toggle('hidden', aba!=='semantico');
  menuFormalizar.classList.toggle('hidden', aba!=='semantico');
  menuCompartilhar.classList.toggle('hidden', aba!=='semantico');
  renderBlocks();
}

/* ---------- Inserção no cursor ---------- */
function inserirNoCursor(textarea, texto){
  const inicio = textarea.selectionStart;
  const fim = textarea.selectionEnd;
  const valorAtual = textarea.value;
  textarea.value = valorAtual.slice(0, inicio) + texto + valorAtual.slice(fim);
  const novaPosicao = inicio + texto.length;
  textarea.selectionStart = textarea.selectionEnd = novaPosicao;
  textarea.focus();
  // dispara o evento 'input' manualmente pra atualizar highlight + salvar
  textarea.dispatchEvent(new Event('input'));
}

/* ---------- Render dos blocos (contextual) ---------- */
function renderBlocks(){
  blocksBar.innerHTML = '';
  if(abaAtual === 'codigo'){
    const lang = fallbackText.dataset.lang || '';
    const lista = CODE_BLOCKS[lang];
    if(!lista) return; // texto simples sem linguagem: sem blocos de código
    lista.forEach(b=>{
      const btn = document.createElement('button');
      btn.className = 'sem-block';
      btn.textContent = b.label;
      btn.onclick = ()=> inserirNoCursor(fallbackText, b.value);
      blocksBar.appendChild(btn);
    });
  } else {
    if(!intentAtual) return;
    TEXT_BLOCKS[intentAtual].forEach(b=>{
      const btn = document.createElement('button');
      btn.className = 'sem-block';
      btn.textContent = b;
      btn.onclick = ()=> inserirNoCursor(fallbackText, b);
      blocksBar.appendChild(btn);
    });
  }
}

/* ---------- Seleção manual de linguagem ---------- */
function mudarLinguagemManual(lang){
  fallbackText.dataset.lang = lang;
  if(lang) localStorage.setItem('lang', lang);
  else localStorage.removeItem('lang');
  fallbackHighlight.innerHTML = highlightCode(fallbackText.value, lang);
  renderBlocks();
}

/* ---------- Intenção (modo semântico) ---------- */
function setIntent(i){
  intentAtual = i;
  localStorage.setItem('intent', i);
  renderBlocks();
}

/* ---------- Refinamentos de texto ---------- */
function refine(type){
  const base = fallbackText.value.trim();
  if(!base){ alert('Adicione blocos ou texto antes de refinar.'); return; }
  if(type === 'formalize'){
    fallbackText.value = 'Prezados,\n\n' + base + '\n\nRespeitosamente.';
  }
  if(type === 'simplify'){
    fallbackText.value = base.replace(/•/g, '.').replace(/\s+/g, ' ');
  }
  fallbackText.dispatchEvent(new Event('input'));
  mostrarStatus('✨ Texto refinado');
}

/* ---------- Compartilhar ---------- */
async function shareText(){
  const text = fallbackText.value.trim();
  if(!text){ alert('Nada para compartilhar.'); return; }
  if(navigator.share){
    try{ await navigator.share({ text }); } catch{}
  } else {
    await navigator.clipboard.writeText(text);
    mostrarStatus('📋 Texto copiado para a área de transferência');
  }
}

function highlightCode(code, ext){
  let out = escapeHtml(code);
  if(/^(js|javascript|java|c|cpp|rust)$/.test(ext)) {
    out = out.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*\n?)/g, m=>`<span class="tok-comment">${escapeHtml(m)}</span>`);
  } else if(ext==='python') {
    out = out.replace(/(#.*?$)/gm, m=>`<span class="tok-comment">${escapeHtml(m)}</span>`);
  }
  out = out.replace(/(`(?:\\.|[^`])*`)/g, m=>`<span class="tok-string">${escapeHtml(m)}</span>`);
  out = out.replace(/(["'])(?:\\.|[^\\])*?\1/g, m=>`<span class="tok-string">${escapeHtml(m)}</span>`);
  out = out.replace(/\b(\d+(\.\d+)?)\b/g, `<span class="tok-number">$1</span>`);
  const kw = "\\b(function|const|let|var|if|else|for|while|return|class|import|from|def|async|await|new|switch|case|break|continue|try|catch|finally|true|false|null)\\b";
  out = out.replace(new RegExp(kw,'g'), `<span class="tok-keyword">$1</span>`);
  out = out.replace(/(&lt;\/?[a-zA-Z0-9\-\:]+)([^&]*?)&gt;/g, (m,p,rest)=> {
    const attrs = rest.replace(/([a-zA-Z-:]+)(\s*=\s*)(".*?"|'.*?'|[^\s"'>]+)/g, `<span class="tok-attr">$1</span>$2<span class="tok-string">$3</span>`);
    return `<span class="tok-tag">${p}</span>${attrs}&gt;`;
  });
  return out;
}

fallbackText.addEventListener('scroll', ()=>{
  fallbackHighlight.scrollTop = fallbackText.scrollTop;
  fallbackHighlight.scrollLeft = fallbackText.scrollLeft;
});
fallbackText.addEventListener('input', ()=>{
  const txt = fallbackText.value;
  localStorage.setItem('minhaNota', txt);
  fallbackHighlight.innerHTML = highlightCode(txt, fallbackText.dataset.lang || '');
});
window.addEventListener('load', ()=>{
  const s = localStorage.getItem('minhaNota');
  if(s) fallbackText.value = s;
  const savedLang = localStorage.getItem('lang') || '';
  fallbackText.dataset.lang = savedLang;
  langSelect.value = savedLang;
  fallbackHighlight.innerHTML = highlightCode(fallbackText.value, savedLang);
  const t = localStorage.getItem('tema') || 'dark';
  document.body.setAttribute('data-theme', t);
  intentAtual = localStorage.getItem('intent') || null;
  renderBlocks();
});
fileInput.addEventListener('change', (ev)=>{
  const f = ev.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const txt = e.target.result;
    fallbackText.value = txt;
    const ext = (f.name.split('.').pop()||'').toLowerCase();
    const mapped = LANGS[ext] || ext || '';
    fallbackText.dataset.lang = mapped;
    langSelect.value = mapped;
    localStorage.setItem('minhaNota', txt);
    if(mapped) localStorage.setItem('lang', mapped);
    fallbackHighlight.innerHTML = highlightCode(txt, mapped);
    renderBlocks();
    mostrarStatus('📄 Arquivo carregado: ' + f.name);
  };
  reader.readAsText(f);
});
function salvarNota(){ localStorage.setItem('minhaNota', fallbackText.value); mostrarStatus('✅ Nota salva!'); }
function apagarNota(){ if(confirm('Apagar tudo?')){ fallbackText.value=''; fallbackHighlight.innerHTML=''; localStorage.removeItem('minhaNota'); mostrarStatus('🧹 Apagado'); } }
function exportarTXT(){
  const blob = new Blob([fallbackText.value], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'minha-nota.txt'; a.click();
  URL.revokeObjectURL(url);
  mostrarStatus('⬇️ Exportado .txt');
}
function exportarHTML(){
  const content = fallbackText.value;
  const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>exported-note</title>
  <style>body{background:#0f1115;color:#c8ccd4;font-family:monospace;padding:20px}pre{white-space:pre-wrap;word-break:break-word;font-size:13px}</style></head><body><pre>${escapeHtml(content)}</pre></body></html>`;
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'minha-nota.html'; a.click();
  URL.revokeObjectURL(url);
  mostrarStatus('⬇️ Exportado .html');
}
function alternarTema(){
  const atual = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.body.setAttribute('data-theme', atual);
  localStorage.setItem('tema', atual);
  mostrarStatus('Tema alterado');
}
function mostrarStatus(msg){ status.textContent = msg; setTimeout(()=>{ if(status.textContent===msg) status.textContent=''; },2500); }
function mostrarSobre(){ alert('Editor totalmente offline.\nSalva localmente e exporta .txt/.html.'); }

// atalhos teclado
fallbackText.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); salvarNota(); }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='o'){ e.preventDefault(); document.getElementById('arquivoInput').click(); }
});

// manifest + service worker
const manifestObj = { name:"Bloco de Notas Offline", short_name:"NotasOffline", start_url:".", display:"standalone", background_color:"#0f1115", theme_color:"#0f1115", icons:[] };
const blobManifest = new Blob([JSON.stringify(manifestObj)], {type:'application/json'});
document.getElementById('dynamic-manifest').setAttribute('href', URL.createObjectURL(blobManifest));

if('serviceWorker' in navigator){
  const swCode = `
  const CACHE_NAME = 'bloco-notas-offline-cache-v1';
  const urlsToCache = ['./'];
  self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(urlsToCache))));
  self.addEventListener('fetch', event => {
    event.respondWith(caches.match(event.request).then(resp => resp || fetch(event.request).then(net => {
      if(net && net.status===200){ caches.open(CACHE_NAME).then(c=>c.put(event.request, net.clone())); }
      return net;
    }).catch(()=>resp))));
  });
  self.addEventListener('activate', e => e.waitUntil(caches.keys().then(keys=>Promise.all(keys.map(k=>k!==CACHE_NAME&&caches.delete(k))))));
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob));
}
</script>
</body>
</html>
