/* botões metálicos / skeuomórficos
================================================== */
.custom-btn {
  width: 190px;
  height: 40px;
  color: #4c4c4c;
  border-radius: 5px;
  padding: 10px 25px;
  font-family: 'Lato', sans-serif;
  font-size: 22px;
  font-weight: 599;
  font-style: normal;
  text-shadow: 0px 1px 0px #fff;
  text-decoration: none;
  background: transparent;
  cursor: pointer;
  position: relative;
  display: inline-block;
  box-shadow: inset 0px 1px 0px rgba(255,255,255,1),0px 1px 3px rgba(0,0,0,0.3);
  outline: none;
  border: 1px solid #ba6;
}
.custom-btn:active {
  -webkit-transform: translateY(2px);
  transform: translateY(2px);
}

.button {
  backface-visibility: hidden;
  position: relative;
  cursor: pointer;
  display: inline-block;
  white-space: nowrap;
  border-color: #7c7c7c;
  background: linear-gradient(180deg,#e6e6e6 0%,rgba(0, 0, 0, 0.25) 49%, rgba(38, 38, 38, 0.6) 51%,rgba(0, 0, 0, 0.25) 100%);
  border-radius: 5px;
  margin-bottom: 25px;
}

/* divisores em relevo
================================================== */
.bottom-gradient {
  position: relative;
  height: 0;
  border-top: 1px solid #ddd;
  border-bottom: 1px solid #fff;
  z-index: -99;
  clear: both;
  margin: 15px 0;
}
.bottom-gradient span {
  border: medium none;
  display: block;
  height: 80px;
  margin: 0;
  padding: 0;
  position: absolute;
  top: -80px;
  z-index: -100;
}
.bottom-gradient .left {
  background: -webkit-radial-gradient(bottom right, circle, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  background: -moz-radial-gradient(bottom right, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  width: 80px;
  left: 0;
}
.bottom-gradient .center {
  background: -webkit-radial-gradient(bottom left, circle, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  background: -moz-radial-gradient(bottom left, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  width: 80px;
  right: 0;
}
.bottom-gradient .right {
  position: relative;
  margin-left: 80px;
  margin-right: 80px;
  top: -80px;
  background: -webkit-linear-gradient(bottom, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
  background: -moz-linear-gradient(bottom, rgba(0,0,0,0.06), rgba(0,0,0,0) 80px);
}

/* status de erro do player */
.player-status {
  margin: 8px 10px;
  font-size: 16px;
  min-height: 20px;
}
.player-status.error { color: #b33; text-shadow: 0px 1px 0px #fff; }
.player-status.loading { color: #777; }

#channel-list li.active {
  font-weight: 700;
  text-decoration: underline;
}

/* abas de fonte (IPTV / Torrent) */
.source-tabs {
  margin: 10px;
}
.tab-btn {
  width: auto;
  height: auto;
  padding: 8px 20px;
  font-size: 18px;
  opacity: 0.6;
}
.tab-btn.active {
  opacity: 1;
  box-shadow: inset 0px 1px 4px rgba(0,0,0,0.35), 0px 1px 0px rgba(255,255,255,0.6);
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* painel torrent */
.torrent-info {
  margin: 8px 10px;
  font-size: 15px;
  color: #555;
}
.torrent-progress {
  width: calc(100% - 20px);
  margin: 8px 10px;
  height: 18px;
  border-radius: 4px;
  appearance: none;
  -webkit-appearance: none;
}
.torrent-progress::-webkit-progress-bar {
  background: #ddd;
  border-radius: 4px;
  box-shadow: inset 0px 1px 2px rgba(0,0,0,0.3);
}
.torrent-progress::-webkit-progress-value {
  background: linear-gradient(180deg, #cde 0%, #89a 100%);
  border-radius: 4px;
}
#torrent-files li {
  cursor: pointer;
  margin-bottom: 0.4em;
}
#torrent-files li.active {
  font-weight: 700;
  text-decoration: underline;
}
</style>

<!-- Dependências -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>

<script>
  const inputFile = document.getElementById('upload-m3u');
  const urlInput = document.getElementById('m3u-url');
  const loadUrlBtn = document.getElementById('load-url');
  const searchInput = document.getElementById('search');
  const list = document.getElementById('channel-list');
  const categoriesDiv = document.getElementById('categories');
  const shortcutsDiv = document.getElementById('shortcuts');
  const video = document.getElementById('iptv-player');
  const statusDiv = document.getElementById('player-status');

  const tabBtnIptv = document.getElementById('tab-btn-iptv');
  const tabBtnTorrent = document.getElementById('tab-btn-torrent');
  const tabPanelIptv = document.getElementById('tab-panel-iptv');
  const tabPanelTorrent = document.getElementById('tab-panel-torrent');

  const magnetInput = document.getElementById('magnet-input');
  const loadMagnetBtn = document.getElementById('load-magnet');
  const torrentInfoDiv = document.getElementById('torrent-info');
  const torrentProgress = document.getElementById('torrent-progress');
  const torrentFilesList = document.getElementById('torrent-files');

  let allChannels = [];
  let currentCategory = null;
  let shortcuts = [];
  let activeChannelUrl = null;
  let hls = null; // instância única do HLS, reutilizada/destruída a cada troca de canal

  let webTorrentClient = null; // cliente WebTorrent único, criado sob demanda
  let activeTorrent = null;
  let activeTorrentFilePath = null;

  // ---------- Abas ----------
  function switchTab(tab) {
    stopAllPlayback();
    const isIptv = tab === 'iptv';
    tabBtnIptv.classList.toggle('active', isIptv);
    tabBtnTorrent.classList.toggle('active', !isIptv);
    tabPanelIptv.classList.toggle('active', isIptv);
    tabPanelTorrent.classList.toggle('active', !isIptv);
    setStatus('');
  }
  tabBtnIptv.addEventListener('click', () => switchTab('iptv'));
  tabBtnTorrent.addEventListener('click', () => switchTab('torrent'));

  // Para qualquer reprodução ativa (HLS ou torrent) antes de iniciar outra,
  // evitando que dois streams competam pelo mesmo elemento <video>.
  function stopAllPlayback() {
    if (hls) {
      hls.destroy();
      hls = null;
    }
    if (activeTorrent) {
      activeTorrent.destroy();
      activeTorrent = null;
      activeTorrentFilePath = null;
      torrentInfoDiv.textContent = '';
      torrentProgress.value = 0;
      torrentFilesList.innerHTML = '';
    }
    video.removeAttribute('src');
    video.load();
  }

  inputFile.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    loadM3U(text);
  });

  loadUrlBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if (!url) return alert("Informe a URL M3U");

    setStatus('Carregando lista...', 'loading');
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      loadM3U(text);
      setStatus('');
    } catch (err) {
      console.error(err);
      setStatus('Erro ao carregar a lista M3U. Verifique a URL ou problemas de CORS.', 'error');
    }
  });

  searchInput.addEventListener('input', renderChannels);

  function setStatus(message, kind) {
    statusDiv.textContent = message;
    statusDiv.className = 'player-status' + (kind ? ' ' + kind : '');
  }

  function loadM3U(text) {
    allChannels = [];
    shortcuts = [];
    currentCategory = null;
    activeChannelUrl = null;

    const lines = text.split('\n');
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('#EXTINF')) {
        const infoLine = lines[i];
        const url = lines[i + 1]?.trim();
        if (!url) continue;

        const nameMatch = infoLine.match(/,(.*)$/);
        const groupMatch = infoLine.match(/group-title="(.*?)"/i);

        const name = nameMatch ? nameMatch[1].trim() : 'Sem Nome';
        const group = groupMatch ? groupMatch[1] : 'Sem Categoria';

        const isFavorite = /#FAV/i.test(infoLine);
        const channel = { name, url, group };

        allChannels.push(channel);
        if (isFavorite) shortcuts.push(channel);
      }
    }

    renderShortcuts();
    renderCategories();
    renderChannels();
  }

  function renderShortcuts() {
    shortcutsDiv.innerHTML = '';
    if (shortcuts.length === 0) return;

    const label = document.createElement('strong');
    label.textContent = '⭐ Favoritos: ';
    shortcutsDiv.appendChild(label);

    shortcuts.forEach(channel => {
      const btn = document.createElement('button');
      btn.className = 'custom-btn button';
      btn.textContent = channel.name;
      btn.style.width = 'auto';
      btn.style.height = 'auto';
      btn.style.margin = '0 0.5em 0.5em 0';
      btn.style.fontSize = '16px';
      btn.style.padding = '6px 14px';
      btn.onclick = () => playChannel(channel.url);
      shortcutsDiv.appendChild(btn);
    });
  }

  function renderCategories() {
    const categories = [...new Set(allChannels.map(c => c.group))];
    categoriesDiv.innerHTML = '';
    categories.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'custom-btn button';
      btn.textContent = cat;
      btn.style.width = 'auto';
      btn.style.height = 'auto';
      btn.style.margin = '0 0.5em 0.5em 0';
      btn.style.fontSize = '16px';
      btn.style.padding = '6px 14px';
      if (cat === currentCategory) btn.style.fontWeight = '700';
      btn.onclick = () => {
        currentCategory = cat === currentCategory ? null : cat;
        renderCategories();
        renderChannels();
      };
      categoriesDiv.appendChild(btn);
    });
  }

  function renderChannels() {
    const search = searchInput.value.toLowerCase();
    list.innerHTML = '';

    const filtered = allChannels.filter(c =>
      (!currentCategory || c.group === currentCategory) &&
      c.name.toLowerCase().includes(search)
    );

    for (const channel of filtered) {
      const li = document.createElement('li');
      li.textContent = channel.name;
      li.style.cursor = 'pointer';
      li.style.marginBottom = '0.5em';
      if (channel.url === activeChannelUrl) li.className = 'active';
      li.onclick = () => playChannel(channel.url);
      list.appendChild(li);
    }
  }

  function playChannel(url) {
    activeChannelUrl = url;
    renderChannels();
    setStatus('Carregando canal...', 'loading');

    // Garante que nenhum outro stream (HLS anterior ou torrent) continue ativo.
    stopAllPlayback();

    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setStatus('');
        video.play().catch(() => {
          // autoplay pode ser bloqueado pelo navegador; o usuário pode dar play manualmente
          setStatus('Canal carregado. Toque em play para iniciar.', '');
        });
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (!data.fatal) return;
        console.error('Erro HLS:', data);
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            setStatus('Erro de rede ao carregar o canal (link inválido, offline ou CORS).', 'error');
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            setStatus('Erro de mídia ao reproduzir este canal.', 'error');
            break;
          default:
            setStatus('Não foi possível reproduzir este canal.', 'error');
            break;
        }
        hls.destroy();
        hls = null;
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('error', () => {
        setStatus('Não foi possível reproduzir este canal.', 'error');
      }, { once: true });
      video.addEventListener('loadedmetadata', () => setStatus(''), { once: true });
    } else {
      setStatus('Seu navegador não suporta HLS.', 'error');
    }
  }

  // ---------- Torrent (P2P via WebTorrent) ----------
  function getWebTorrentClient() {
    if (!webTorrentClient) {
      webTorrentClient = new WebTorrent();
      webTorrentClient.on('error', (err) => {
        console.error('Erro WebTorrent:', err);
        setStatus('Erro no cliente de torrent: ' + (err.message || err), 'error');
      });
    }
    return webTorrentClient;
  }

  function formatBytes(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) {
      bytes /= 1024;
      i++;
    }
    return `${bytes.toFixed(1)} ${units[i]}`;
  }

  function isVideoFile(file) {
    return /\.(mp4|webm|mkv|m4v|ogv)$/i.test(file.name);
  }

  loadMagnetBtn.addEventListener('click', () => {
    const magnetURI = magnetInput.value.trim();
    if (!magnetURI) return alert('Cole um magnet link.');
    if (!magnetURI.startsWith('magnet:')) {
      return alert('Isso não parece ser um magnet link válido (deve começar com "magnet:").');
    }
    loadTorrent(magnetURI);
  });

  function loadTorrent(magnetURI) {
    stopAllPlayback();
    setStatus('Conectando aos peers...', 'loading');
    torrentInfoDiv.textContent = 'Buscando metadados do torrent...';

    const client = getWebTorrentClient();

    client.add(magnetURI, (torrent) => {
      activeTorrent = torrent;
      renderTorrentFiles(torrent);

      // Seleciona automaticamente o primeiro arquivo de vídeo reconhecido
      const firstVideo = torrent.files.find(isVideoFile);
      if (firstVideo) {
        playTorrentFile(firstVideo);
      } else {
        setStatus('Nenhum arquivo de vídeo reconhecido neste torrent. Escolha um arquivo na lista.', 'error');
      }

      torrent.on('download', () => {
        if (torrent !== activeTorrent) return; // torrent antigo, ignora
        const pct = (torrent.progress * 100).toFixed(1);
        torrentProgress.value = pct;
        torrentInfoDiv.textContent =
          `Peers: ${torrent.numPeers} · Baixado: ${formatBytes(torrent.downloaded)} / ${formatBytes(torrent.length)} ` +
          `· Velocidade: ${formatBytes(torrent.downloadSpeed)}/s · ${pct}%`;
      });

      torrent.on('done', () => {
        if (torrent !== activeTorrent) return;
        torrentInfoDiv.textContent = 'Download completo. Reprodução não depende mais da rede.';
      });

      torrent.on('error', (err) => {
        console.error('Erro no torrent:', err);
        setStatus('Erro ao processar o torrent: ' + (err.message || err), 'error');
      });
    });
  }

  function renderTorrentFiles(torrent) {
    torrentFilesList.innerHTML = '';
    torrent.files.forEach((file) => {
      const li = document.createElement('li');
      li.textContent = `${file.name} (${formatBytes(file.length)})`;
      if (file.path === activeTorrentFilePath) li.className = 'active';
      li.onclick = () => playTorrentFile(file);
      torrentFilesList.appendChild(li);
    });
  }

  function playTorrentFile(file) {
    activeTorrentFilePath = file.path;
    if (activeTorrent) renderTorrentFiles(activeTorrent);

    if (!isVideoFile(file)) {
      setStatus(`"${file.name}" não parece ser um formato de vídeo suportado pelo navegador.`, 'error');
    }

    setStatus('Preparando streaming do arquivo...', 'loading');
    video.removeAttribute('src');
    video.load();

    // renderTo faz o streaming progressivo direto no elemento <video>,
    // sem precisar esperar o torrent terminar de baixar.
    file.renderTo(video, { autoplay: true }, (err) => {
      if (err) {
        console.error('Erro ao renderizar arquivo do torrent:', err);
        setStatus('Não foi possível reproduzir este arquivo (formato/codec pode não ser suportado pelo navegador).', 'error');
        return;
      }
      setStatus('');
    });
  }
</script>
